    teamUnsub = KDB.watchTeam(function (list) { teamList = list; renderTeam(); });
  }
  function closeTeam() {
    if (teamUnsub) { teamUnsub(); teamUnsub = null; }
    $("teamOverlay").hidden = true; document.body.style.overflow = "";
  }
  $("openTeam").onclick = openTeam;
  $("teamClose").onclick = closeTeam;
  $("teamOverlay").addEventListener("click", function (e) { if (e.target === this) closeTeam(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("teamOverlay").hidden) closeTeam(); });

  function renderTeam() {
    if (!teamList) {
      $("teamBody").innerHTML = '<p class="err">Ekipa trenutno nije dostupna. ' + esc(KDB.teamError || "") + '</p>';
      return;
    }
    var t = todayKey(), y = shift(t, -1), me = KDB.myId();
    var names = (window.KORISNICI || []).map(function (u) { return u.name; });
    var list = teamList.filter(function (m) { return names.indexOf(m.name) !== -1; });   // samo trenutni korisnici
    // ja uvek sa najsvežijim podacima, i kad upis u bazu još nije stigao
    var mine = Object.assign({ uid: me }, teamDoc());
    list = list.filter(function (m) { return m.uid !== me; }).concat([mine]);
    list.forEach(function (m) {
      m.today = m.day === t;
      m.active = m.last && m.last >= y ? m.streak : 0;
    });
    list.sort(function (a, b) { return b.active - a.active || (b.today ? b.pct : -1) - (a.today ? a.pct : -1) || a.name.localeCompare(b.name, "sr"); });
    var logged = list.filter(function (m) { return m.today && m.pct > 0; }).length;
    var html = '<p class="team-sum">Danas ' + (list.length === 2 ? (logged === 2 ? "ste oboje uneli obroke." : logged === 1 ? "je jedno od vas unelo obroke." : "još niko nije uneo obroke.") : "je " + logged + " od " + list.length + " unelo obroke.") + '</p><ul class="team">';
    list.forEach(function (m) {
      var pct = m.today ? m.pct : 0, cls = pct > 110 ? "over" : pct > 100 ? "near" : "";
      html += '<li class="tm' + (m.uid === me ? " me" : "") + '"><span class="ava">' + esc(m.name.charAt(0)) + '</span>' +
        '<div class="tm-main"><b>' + esc(m.name) + (m.uid === me ? " <small>(ti)</small>" : "") + '</b>' +
        '<div class="tbar"><i class="' + cls + '" style="width:' + Math.min(100, pct) + '%"></i></div>' +
        '<small>' + (pct > 0 ? pct + "% današnjeg cilja" : "Danas još ništa") + (m.best > 1 ? " · najbolji niz " + m.best : "") + '</small>' +
        (m.smoke >= 0 ? '<small class="tm-smoke">Bez cigare: ' + m.smoke + ' ' + daysWord(m.smoke) + '</small>' : "") + '</div>' +
        (m.active ? '<span class="tm-streak">' + FLAME + m.active + '<small>' + (m.active === 1 ? "dan" : "dana") + '</small></span>'
                  : '<span class="tm-streak off">0<small>dana</small></span>') + '</li>';
    });
    html += '</ul>';
    $("teamBody").innerHTML = html;
  }
  KDB.onChange(function (what) { if (what === "team" && teamUnsub) renderTeam(); });

  // ---------- težina ----------
  // Čuva se: prvo merenje, poslednjih 8 merenja i mesečni prosek za starija (jedan broj po mesecu).
  var KEEP_WEIGHTS = 8;
  function weightKey() { return "kalorije.merenje.odlozeno." + (KDB.user ? KDB.user.id : ""); }
  function lastWeight() { var w = state.weights; return w && w.entries && w.entries.length ? w.entries[w.entries.length - 1] : null; }
  // upiše merenje u state (bez čuvanja)
  function recordWeight(kg) {
    var t = todayKey(), w = state.weights || { start: null, entries: [], months: {} };
    w.entries = (w.entries || []).filter(function (e) { return e.d !== t; });
    w.months = w.months || {};
    if (!w.start) w.start = { d: t, kg: kg };
    w.entries.push({ d: t, kg: kg });
    w.entries.sort(function (a, b) { return a.d < b.d ? -1 : 1; });
    while (w.entries.length > KEEP_WEIGHTS) {             // najstarije merenje ide u mesečni prosek
      var o = w.entries.shift(), ym = o.d.slice(0, 7), m = w.months[ym] || [0, 0];
      w.months[ym] = [Math.round((m[0] * m[1] + o.kg) / (m[1] + 1) * 10) / 10, m[1] + 1];
    }
    state.weights = w;
    if (state.profile) state.profile.weight = kg;          // nova težina menja i dnevnu potrošnju
  }
  function addWeight(kg) { recordWeight(kg); save(); render(); }
  // težina iz profila se računa kao merenje: prvo merenje ili promena težine u profilu
  function seedWeight() {
    if (!state.profile) return false;
    var l = lastWeight();
    if (l && l.kg === state.profile.weight) return false;
    recordWeight(state.profile.weight);
    return true;
  }
  function weightDue() {
    if (!state.profile) return false;
    var l = lastWeight();
    if (l && daysBetween(l.d, todayKey()) < 7) return false;
    try { if (localStorage.getItem(weightKey()) === todayKey()) return false; } catch (e) {}
    return true;
  }
  function anyOpen() {
    return ["overlay", "foodOverlay", "teamOverlay", "weightOverlay", "exOverlay", "smokeOverlay"].some(function (id) { return !$(id).hidden; });
  }
  function maybeAskWeight() { if (weightDue() && !anyOpen()) openWeight(true); }
  function openWeight(prompted) {
    var l = lastWeight();
    $("weightIntro").textContent = prompted
      ? (l ? "Prošla je nedelja od poslednjeg merenja (" + dec(l.kg) + " kg, " + dateLabel(l.d).slice(0, -1) + "). Koliko imaš danas?" : "Upiši težinu jednom nedeljno, pa ćeš u profilu videti kako napreduješ.")
      : "Upiši današnju težinu.";
    $("wIn").value = l ? dec(l.kg) : state.profile ? dec(state.profile.weight) : "";
    $("wErr").textContent = "";
    $("wLater").hidden = !prompted;
    $("weightOverlay").hidden = false; document.body.style.overflow = "hidden";
  }
  function closeWeight() { $("weightOverlay").hidden = true; if (!anyOpen()) document.body.style.overflow = ""; }
  $("weightClose").onclick = function () { snoozeWeight(); closeWeight(); };
  $("weightOverlay").addEventListener("click", function (e) { if (e.target === this) { snoozeWeight(); closeWeight(); } });
  function snoozeWeight() { try { localStorage.setItem(weightKey(), todayKey()); } catch (e) {} }
  $("wLater").onclick = function () { snoozeWeight(); closeWeight(); };
  $("weightForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var kg = parseFloat(String($("wIn").value).replace(",", "."));
    if (!(kg >= 30 && kg <= 300)) { $("wErr").textContent = "Unesi težinu između 30 i 300 kg."; return; }
    addWeight(Math.round(kg * 10) / 10);
    closeWeight();
    if (!$("overlay").hidden) { openSheet(); }
  });

  function weightPoints() {
    var w = state.weights; if (!w) return [];
    var pts = Object.keys(w.months || {}).map(function (ym) { return { d: ym + "-15", kg: w.months[ym][0], avg: true }; });
    return pts.concat(w.entries || []).sort(function (a, b) { return a.d < b.d ? -1 : 1; });
  }
  function weightChart(pts) {
    var W = 320, H = 150, L = 34, Rm = 10, T = 12, B = 22;
    var t0 = parseKey(pts[0].d).getTime(), t1 = parseKey(pts[pts.length - 1].d).getTime(), span = Math.max(t1 - t0, 1);
    var ks = pts.map(function (p) { return p.kg; }), lo = Math.floor(Math.min.apply(null, ks) - 1), hi = Math.ceil(Math.max.apply(null, ks) + 1);
    var X = function (p) { return pts.length === 1 ? (L + W - Rm) / 2 : L + (parseKey(p.d).getTime() - t0) / span * (W - L - Rm); };
    var Y = function (kg) { return T + (hi - kg) / (hi - lo) * (H - T - B); };

    [lo, (lo + hi) / 2, hi].forEach(function (v) {
      svg += '<line class="grid" x1="' + L + '" x2="' + (W - Rm) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text x="' + (L - 6) + '" y="' + (Y(v) + 3) + '" text-anchor="end">' + dec(v) + '</text>';

      svg += '<polyline class="ln" points="' + line + '"/>';
    }
    pts.forEach(function (p, i) { svg += '<circle class="pt' + (i === pts.length - 1 ? " last" : "") + '" cx="' + X(p).toFixed(1) + '" cy="' + Y(p.kg).toFixed(1) + '" r="' + (p.avg ? 3 : 4) + '"/>'; });
    var lbl = function (p) { var d = parseKey(p.d); return p.avg ? MONTHS[d.getMonth()].slice(0, 3) + " " + String(d.getFullYear()).slice(2) : d.getDate() + "." + (d.getMonth() + 1) + "."; };
    svg += '<text x="' + X(pts[0]) + '" y="' + (H - 6) + '" text-anchor="' + (pts.length === 1 ? "middle" : "start") + '">' + lbl(pts[0]) + '</text>';

  // ---------- automatsko osvežavanje nove verzije ----------
  // version.json se uvek čita bez keša; ako je na sajtu novija verzija, stranica se sama ponovo učita.
  var lastVersionCheck = 0;
  function checkVersion() {
    if (Date.now() - lastVersionCheck < 60000 || anyOpen()) return;
    lastVersionCheck = Date.now();
    fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.v || j.v === APP_VERSION) return;
      var k = "kalorije.osvezeno." + j.v;
      try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, "1"); } catch (e) {}
      fetch("./", { cache: "reload" }).catch(function () {}).then(function () { location.reload(); });
    }).catch(function () {});
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") checkVersion(); });
  setTimeout(checkVersion, 3000);

  // ---------- rod u tekstu (potrošio / potrošila) ----------
  // muški / ženski oblik prema polu iz profila; bez profila "potrošio/la"
  function gw(m, f) {
    var sx = state.profile && state.profile.sex;
    if (sx === "m") return m;
    if (sx === "f") return f;
    var stem = m.slice(0, -1);
    return f.indexOf(stem) === 0 ? m + "/" + f.slice(stem.length) : m + "/" + f;
  }
  function daysWord(n) { return n % 10 === 1 && n % 100 !== 11 ? "dan" : "dana"; }

  // ---------- vežbanje ----------

  function openExercise() {

    $("exForm").querySelector(".w-intro").textContent = "Upiši koliko si kalorija " + gw("potrošio", "potrošila") +

  function closeExercise() { $("exOverlay").hidden = true; if (!anyOpen()) document.body.style.overflow = ""; }
  function setBurned(v) {

    if (v > 0) state.days[day].vezbanje = v; else delete state.days[day].vezbanje;
    save(); render(); closeExercise();
  }
  $("exBtn").onclick = openExercise;
  $("exClose").onclick = closeExercise;
  $("exOverlay").addEventListener("click", function (e) {
    if (e.target === this) return closeExercise();

  // ---------- bez cigare ----------
  // state.smoke = { since: "YYYY-MM-DD" } — dan poslednje cigare; brojač kreće od tog dana.
  var PACK_PRICE = 450;   // dinara; jedna kutija dnevno
  function smokeUser() {
    var me = KDB.user && (window.KORISNICI || []).filter(function (u) { return u.id === KDB.user.id; })[0];
    return !!(me && me.cigare);
  }
  function smokeOn() { return !!(state.smoke && state.smoke.since); }
  function smokeDays() { return smokeOn() ? Math.max(0, daysBetween(state.smoke.since, todayKey())) : 0; }
  function smokeMoney() { return smokeDays() * PACK_PRICE; }
  var SAD = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M8 16.5c2.2-2.2 5.8-2.2 8 0"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="3"/></svg>';

  $("smokeClose").onclick = closeSmoke;
  $("smokeOverlay").addEventListener("click", function (e) { if (e.target === this) closeSmoke(); });
  function setSmokeSince(k) { state.smoke = { since: k }; save(); render(); renderSmoke(); }
  function renderSmoke() {
    var html;
    if (!smokeOn()) {
      html = '<p class="w-intro">Brojimo dane bez cigare i koliko je novca ušteđeno (' + PACK_PRICE + ' din za svaki dan, jedna kutija dnevno).</p>' +
        '<div class="smoke-date"><label class="lbl" for="smokeDate">Kad je bila poslednja cigara?</label>' +

        '<div class="smoke-actions"><button class="btn danger relapse" type="button" id="relapse">' + SAD +
          '<span>' + gw("Prekršio", "Prekršila") + ' sam</span></button></div>' +
        '<details class="smoke-date"><summary class="src">Promeni datum poslednje cigare</summary>' +

  // ---------- izvoz u PDF i deljenje ----------
  // Biblioteka i font se učitaju unapred (posle prijave), da bi klik odmah otvorio deljenje:
  // telefoni dozvoljavaju meni za deljenje samo neposredno posle dodira.
  var pdfLibs = null;
  function loadScript(src) {
    return new Promise(function (res, rej) {
      var el = document.createElement("script"); el.src = src; el.onload = res;
      el.onerror = function () { rej(new Error("Ne mogu da učitam " + src)); };
      document.head.appendChild(el);
    });
  }
  function preloadPdf() {
    if (!pdfLibs) pdfLibs = Promise.all([loadScript("lib/jspdf.umd.min.js"), loadScript("lib/pdf-font.js")]).catch(function (e) { pdfLibs = null; throw e; });
    return pdfLibs;
  }
  function pdfReady() { return !!(window.jspdf && window.KPDF_FONT); }

  function shortDate(k) { var d = parseKey(k); return d.getDate() + ". " + MONTHS[d.getMonth()].slice(0, 3) + " " + d.getFullYear() + "."; }
  function dateLabel(k) { var d = parseKey(k); return DAYS[d.getDay()] + ", " + d.getDate() + ". " + MONTHS[d.getMonth()] + " " + d.getFullYear() + "."; }

  function buildPdf() {
    var doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
    doc.addFileToVFS("DejaVuSans.ttf", window.KPDF_FONT.regular);
    doc.addFileToVFS("DejaVuSans-Bold.ttf", window.KPDF_FONT.bold);
    doc.addFont("DejaVuSans.ttf", "DejaVu", "normal");
    doc.addFont("DejaVuSans-Bold.ttf", "DejaVu", "bold");
    var W = 210, L = 16, R = W - 16, y = 20;
    var INK = [22, 33, 26], MUTED = [93, 107, 97], LINE = [214, 222, 213], BRAND = [31, 92, 58];
    var CP = [61, 130, 214], CC = [226, 169, 31], CF = [214, 69, 58];
    function font(w, size, col) { doc.setFont("DejaVu", w); doc.setFontSize(size); doc.setTextColor.apply(doc, col || INK); }
    function hr(yy) { doc.setDrawColor.apply(doc, LINE); doc.setLineWidth(0.3); doc.line(L, yy, R, yy); }
    function need(h) { if (y + h > 282) { doc.addPage(); y = 20; } }
    function dot(x, yy, col) { doc.setFillColor.apply(doc, col); doc.circle(x, yy, 1.3, "F"); }

    var burned = burnedOn(day), g = goal(), dd = dayData(), eaten = 0, mp = 0, mc = 0, mf = 0;
    MEALS.forEach(function (m) { (dd[m.id] || []).forEach(function (it) { eaten += it.kcal; mp += it.p || 0; mc += it.c || 0; mf += it.f || 0; }); });

    // zaglavlje
    doc.setFillColor.apply(doc, BRAND); doc.rect(0, 0, W, 34, "F");
    font("bold", 22, [242, 247, 241]); doc.text("bolja.ja", L, 16);
    font("normal", 11, [220, 235, 222]); doc.text((KDB.user ? KDB.user.name + " · " : "") + dateLabel(day), L, 25);
    y = 46;

    // sažetak
    var boxW = (R - L - 8) / 3, left = g - eaten;
    [["Cilj", fmt(g) + " kcal"], ["Uneto", fmt(eaten) + " kcal"], [left < 0 ? "Preko cilja" : "Preostalo", fmt(Math.abs(left)) + " kcal"]].forEach(function (b, i) {
      var x = L + i * (boxW + 4);
      doc.setFillColor(238, 242, 236); doc.roundedRect(x, y - 7, boxW, 18, 2.5, 2.5, "F");
      font("normal", 8.5, MUTED); doc.text(b[0].toUpperCase(), x + 4, y - 1);
      font("bold", 13, i === 2 && left < 0 ? CF : INK); doc.text(b[1], x + 4, y + 7);
    });
    y += 20;
    [[CP, "Proteini", mp], [CC, "Ugljeni hidrati", mc], [CF, "Masti", mf]].forEach(function (mm, i) {
      var x = L + i * (boxW + 4);
      dot(x + 1.5, y - 1.2, mm[0]);
      font("normal", 10, MUTED); doc.text(mm[1], x + 5, y);
      font("bold", 10, INK); doc.text(fmt(mm[2]) + (i === 0 && proteinGoal() ? " / " + proteinGoal() : "") + " g", x + boxW - 2, y, { align: "right" });
    });
    y += 8;
    y += 2;

    // pregled: vežbanje, niz dana, cigare, telo
    var rows = [];
    if (burned) rows.push(["Vežbanje", fmt(burned) + " kcal potrošeno (bonus, ne menja cilj)"]);
    var sk = updateStreak();
    rows.push(["Niz dana", sk.count + " " + daysWord(sk.count) + " zaredom sa unetim obrocima · najbolji " + (state.best || sk.count)]);
    if (smokeOn()) rows.push(["Bez cigare", smokeDays() + " " + daysWord(smokeDays()) + " · ušteđeno " + fmt(smokeMoney()) + " din"]);
    if (state.profile) {
      var r = calc(state.profile), bc = bmiCat(r.bmi);
      rows.push(["BMI", r.bmi.toFixed(1).replace(".", ",") + " · " + bc.t.toLowerCase(), bc.c]);
      rows.push(["Telo", state.profile.height + " cm · " + dec(state.profile.weight) + " kg · dnevna potrošnja " + fmt(r.tdee) + " kcal"]);
    }
    var w = state.weights, lw = lastWeight();
    if (w && lw && w.start) {
      var dw = lw.kg - w.start.kg;
      rows.push(["Težina", "početak " + dec(w.start.kg) + " kg (" + shortDate(w.start.d) + "), sada " + dec(lw.kg) + " kg (" + (dw > 0 ? "+" : dw < 0 ? "−" : "") + dec(Math.abs(dw)) + " kg)"]);
    }
    var boxH = rows.length * 6.5 + 5;
    doc.setFillColor(244, 247, 243); doc.roundedRect(L, y, R - L, boxH, 2.5, 2.5, "F");
    rows.forEach(function (rw, i) {
      var yy = y + 7 + i * 6.5;
      font("normal", 9, MUTED); doc.text(rw[0], L + 4, yy);
      if (rw[2]) { var hx = rw[2].replace("#", ""); dot(L + 34, yy - 1.1, [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)]); }
      font("bold", 9.5, INK); doc.text(rw[1], L + (rw[2] ? 37 : 32), yy);
    });
    y += boxH + 6;

    // grafikon težine
    var pts = weightPoints();
    if (pts.length > 1) {
      var cx0 = L + 12, cx1 = R - 2, cy0 = y + 4, cy1 = y + 30;
      var ks = pts.map(function (p) { return p.kg; }), lo = Math.floor(Math.min.apply(null, ks) - 1), hi = Math.ceil(Math.max.apply(null, ks) + 1);
      var t0 = parseKey(pts[0].d).getTime(), t1 = parseKey(pts[pts.length - 1].d).getTime(), span = Math.max(t1 - t0, 1);
      var PX = function (p) { return cx0 + (parseKey(p.d).getTime() - t0) / span * (cx1 - cx0); };
      var PY = function (kg) { return cy0 + (hi - kg) / (hi - lo) * (cy1 - cy0); };
      font("bold", 10, INK); doc.text("Težina kroz vreme", L, y); y += 2;
      doc.setDrawColor.apply(doc, LINE); doc.setLineWidth(0.2);
      [lo, hi].forEach(function (v) { doc.line(cx0, PY(v), cx1, PY(v)); font("normal", 7.5, MUTED); doc.text(dec(v), cx0 - 2, PY(v) + 1, { align: "right" }); });
      doc.setDrawColor(47, 138, 79); doc.setLineWidth(0.7);
      for (var pi = 1; pi < pts.length; pi++) doc.line(PX(pts[pi - 1]), PY(pts[pi - 1].kg), PX(pts[pi]), PY(pts[pi].kg));
      doc.setFillColor(47, 138, 79);
      pts.forEach(function (p) { doc.circle(PX(p), PY(p.kg), 0.9, "F"); });
      font("normal", 7.5, MUTED);
      doc.text(shortDate(pts[0].d), cx0, cy1 + 4); doc.text(shortDate(pts[pts.length - 1].d), cx1, cy1 + 4, { align: "right" });
      y = cy1 + 9;
    }
    hr(y); y += 9;

    // obroci
    var any = false;
    MEALS.forEach(function (m) {
      var items = dd[m.id] || [];
      if (!items.length) return;
      any = true;
      need(16);
      var tot = items.reduce(function (s, x) { return s + x.kcal; }, 0);
      font("bold", 13, INK); doc.text(m.name, L, y);
      doc.text(fmt(tot) + " kcal", R, y, { align: "right" });
      y += 6;
      font("normal", 8, MUTED);
      doc.text("Količina", 112, y, { align: "right" }); doc.text("kcal", 132, y, { align: "right" });
      doc.text("P", 152, y, { align: "right" }); doc.text("UH", 172, y, { align: "right" }); doc.text("M", R, y, { align: "right" });
      y += 2; hr(y); y += 5;
      items.forEach(function (it) {
        font("normal", 10, INK);                         // veličina mora biti postavljena pre prelamanja
        var name = doc.splitTextToSize(it.name, 72);
        need(name.length * 4.6 + 3);
        font("normal", 10, INK); doc.text(name, L, y);
        var qty = it.dish ? dec(it.qty) + " porc." : it.food ? fmt(it.qty) + " " + it.unit : "";
        font("normal", 9.5, MUTED); doc.text(qty, 112, y, { align: "right" });
        font("bold", 10, INK); doc.text(fmt(it.kcal), 132, y, { align: "right" });
        font("normal", 9.5, MUTED);
        if (it.p != null) {
          doc.text(dec(it.p), 152, y, { align: "right" }); doc.text(dec(it.c), 172, y, { align: "right" }); doc.text(dec(it.f), R, y, { align: "right" });
        } else doc.text("—", R, y, { align: "right" });
        y += name.length * 4.6 + 1.6;
        doc.setDrawColor(236, 240, 234); doc.setLineWidth(0.2); doc.line(L, y - 3.2, R, y - 3.2);
      });
      y += 6;
    });
    if (!any) { font("normal", 11, MUTED); doc.text(day === todayKey() ? "Danas još ništa nije uneto." : "Za ovaj dan ništa nije uneto.", L, y); y += 8; }

    // podnožje
    var pages = doc.getNumberOfPages();
    for (var i = 1; i <= pages; i++) {
      doc.setPage(i);
      font("normal", 8, MUTED);
      doc.text("Napravljeno u aplikaciji bolja.ja · P = proteini, UH = ugljeni hidrati, M = masti (u gramima)", L, 290);
      if (pages > 1) doc.text(i + " / " + pages, R, 290, { align: "right" });
    }
    return doc.output("blob");
  }

  function exportMsg(t) { $("exportMsg").textContent = t || ""; }
  function fileName() { return "bolja-ja-" + (KDB.user ? norm(KDB.user.name) + "-" : "") + day + ".pdf"; }

  function sharePdf() {
    var blob = buildPdf();
    var file = new File([blob], fileName(), { type: "application/pdf" });
    var title = "bolja.ja – " + (KDB.user ? KDB.user.name + ", " : "") + dateLabel(day);
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      return navigator.share({ files: [file], title: title }).then(function () { exportMsg(""); }, function (e) {
        if (e && e.name === "AbortError") return exportMsg("");
        openPdf(blob, "Deljenje nije uspelo, pa je PDF otvoren u novom tabu.");
      });
    }
    openPdf(blob, "Ovaj browser ne podržava deljenje fajlova, pa je PDF otvoren u novom tabu. Odatle ga podeli.");
    return Promise.resolve();
  }
  function openPdf(blob, msg) {
    var url = URL.createObjectURL(blob);
    var w = window.open(url, "_blank");
    exportMsg(w ? msg : "Browser je blokirao otvaranje PDF-a. Dozvoli iskačuće prozore za ovaj sajt i pokušaj ponovo.");
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  $("exportBtn").onclick = function () {
    var btn = this;
    if (pdfReady()) {
      try { sharePdf(); } catch (e) { exportMsg("PDF nije napravljen: " + e.message); }
      return;
    }
    // prvi put bez interneta ili sporo učitavanje: pripremi, pa traži još jedan dodir
    btn.disabled = true; $("exportLbl").textContent = "Pripremam…"; exportMsg("");
    preloadPdf().then(function () {
      $("exportLbl").textContent = "Podeli PDF"; exportMsg("PDF je spreman. Dodirni dugme ponovo da ga podeliš.");
    }, function () {
      $("exportLbl").textContent = "Izvezi"; exportMsg("Nema interneta. Pokušaj ponovo kad se povežeš.");
    }).then(function () { btn.disabled = false; });
  };
  KDB.onChange(function (what) { if (what === "auth" && KDB.user) setTimeout(function () { preloadPdf().catch(function () {}); }, 1200); });

  render();
})();
</script>
