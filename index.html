  // ---------- prijava, nalog i sinhronizacija ----------
  function renderAccount() {
    var html = "";
    if (KDB.user) {
      html = '<div class="acct in"><span class="ava">' + esc(KDB.user.name.charAt(0)) + '</span><span><b>' + esc(KDB.user.name) + '</b>' +
        (KDB.cloud ? "Obroci se čuvaju na tvom nalogu." : "Lokalni režim: podaci su samo na ovom uređaju.") +
        '</span><button class="btn ghost" id="logout">Odjavi se</button></div>';
    }
    if (KDB.error) html += '<p class="err">' + esc(KDB.error) + '</p>';
    $("account").innerHTML = html;
    if ($("logout")) $("logout").onclick = function () { this.disabled = true; KDB.logout(); };
    $("login").hidden = !KDB.ready || !!KDB.user;
    if (!$("login").hidden) { $("loginBtn").disabled = false; if (KDB.error) $("loginErr").textContent = KDB.error; }
  }
  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    $("loginErr").textContent = ""; $("loginBtn").disabled = true; $("loginBtn").textContent = "Ulazim…";
    KDB.login($("username").value).then(function () {
      $("username").value = "";
    }, function (err) {
      $("loginErr").textContent = err.message;
    }).then(function () { $("loginBtn").disabled = false; $("loginBtn").textContent = "Uđi"; });
  });

  var lastUid = null;
  KDB.onChange(function (what) {
    if (what === "auth") {
      var uid = KDB.user && KDB.user.uid;
      if (uid && uid !== lastUid) {
        lastUid = uid;
        state = loadLocal(); day = todayKey(); openMeals = {};
        render();
        KDB.loadPersonal().then(function (cloud) {
          if (KDB.myId() !== uid) return;
          if (cloud) state = fill(cloud);
          else if (KDB.cloud) KDB.savePersonal(state, Object.keys(state.days)); // prvi put: prebaci uneto na ovom uređaju
          try { localStorage.setItem(userKey(), JSON.stringify(state)); } catch (e) {}
          render();
        }).catch(function (e) { KDB.error = e.message; renderAccount(); });
      }
      if (!uid && lastUid) {
        lastUid = null; state = emptyState(); openMeals = {};
        closeSheet(); closeFoods(); render();
      }
      renderAccount();
    }
    if (what === "community") {
      reindex();
      if (fs.view === "list") renderList();
    }
  });
  renderAccount();

  // ---------- izvoz u PDF i deljenje ----------
  // Biblioteka i font se učitaju unapred (posle prijave), da bi klik odmah otvorio deljenje:
  // telefoni dozvoljavaju meni za deljenje samo neposredno posle dodira.
  var pdfLibs = null;
  function loadScript(src) {
    return new Promise(function (res, rej) {
      var el = document.createElement("script"); el.src = src; el.onload = res;
      el.onerror = function () { rej(new Error("Ne mogu da učitam " + src)); };
      document.head.appendChild(el);
    });
  }
  function preloadPdf() {
    if (!pdfLibs) pdfLibs = Promise.all([loadScript("lib/jspdf.umd.min.js"), loadScript("lib/pdf-font.js")]).catch(function (e) { pdfLibs = null; throw e; });
    return pdfLibs;
  }
  function pdfReady() { return !!(window.jspdf && window.KPDF_FONT); }

  function dateLabel(k) { var d = parseKey(k); return DAYS[d.getDay()] + ", " + d.getDate() + ". " + MONTHS[d.getMonth()] + " " + d.getFullYear() + "."; }

  function buildPdf() {
    var doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
    doc.addFileToVFS("DejaVuSans.ttf", window.KPDF_FONT.regular);
    doc.addFileToVFS("DejaVuSans-Bold.ttf", window.KPDF_FONT.bold);
    doc.addFont("DejaVuSans.ttf", "DejaVu", "normal");
    doc.addFont("DejaVuSans-Bold.ttf", "DejaVu", "bold");
    var W = 210, L = 16, R = W - 16, y = 20;
    var INK = [22, 33, 26], MUTED = [93, 107, 97], LINE = [214, 222, 213], BRAND = [31, 92, 58];
    var CP = [61, 130, 214], CC = [226, 169, 31], CF = [214, 69, 58];
    function font(w, size, col) { doc.setFont("DejaVu", w); doc.setFontSize(size); doc.setTextColor.apply(doc, col || INK); }
    function hr(yy) { doc.setDrawColor.apply(doc, LINE); doc.setLineWidth(0.3); doc.line(L, yy, R, yy); }
    function need(h) { if (y + h > 282) { doc.addPage(); y = 20; } }
    function dot(x, yy, col) { doc.setFillColor.apply(doc, col); doc.circle(x, yy, 1.3, "F"); }

    var g = goal(), dd = dayData(), eaten = 0, mp = 0, mc = 0, mf = 0;
    MEALS.forEach(function (m) { (dd[m.id] || []).forEach(function (it) { eaten += it.kcal; mp += it.p || 0; mc += it.c || 0; mf += it.f || 0; }); });

    // zaglavlje
    doc.setFillColor.apply(doc, BRAND); doc.rect(0, 0, W, 34, "F");
    font("bold", 22, [242, 247, 241]); doc.text("kalorije.", L, 16);
    font("normal", 11, [220, 235, 222]); doc.text((KDB.user ? KDB.user.name + " · " : "") + dateLabel(day), L, 25);
    y = 46;

    // sažetak
    var boxW = (R - L - 8) / 3, left = g - eaten;
    [["Cilj", fmt(g) + " kcal"], ["Uneto", fmt(eaten) + " kcal"], [left < 0 ? "Preko cilja" : "Preostalo", fmt(Math.abs(left)) + " kcal"]].forEach(function (b, i) {
      var x = L + i * (boxW + 4);
      doc.setFillColor(238, 242, 236); doc.roundedRect(x, y - 7, boxW, 18, 2.5, 2.5, "F");
      font("normal", 8.5, MUTED); doc.text(b[0].toUpperCase(), x + 4, y - 1);
      font("bold", 13, i === 2 && left < 0 ? CF : INK); doc.text(b[1], x + 4, y + 7);
    });
    y += 20;
    [[CP, "Proteini", mp], [CC, "Ugljeni hidrati", mc], [CF, "Masti", mf]].forEach(function (mm, i) {
      var x = L + i * (boxW + 4);
      dot(x + 1.5, y - 1.2, mm[0]);
      font("normal", 10, MUTED); doc.text(mm[1], x + 5, y);
      font("bold", 10, INK); doc.text(fmt(mm[2]) + " g", x + boxW - 2, y, { align: "right" });
    });
    y += 8;
    if (state.profile) {
      var r = calc(state.profile);
      font("normal", 9, MUTED);
      doc.text("Visina " + state.profile.height + " cm · Težina " + String(state.profile.weight).replace(".", ",") + " kg · BMI " +
        r.bmi.toFixed(1).replace(".", ",") + " (" + bmiCat(r.bmi).t.toLowerCase() + ") · Dnevna potrošnja " + fmt(r.tdee) + " kcal", L, y);
      y += 6;
    }
    hr(y); y += 9;

    // obroci
    var any = false;
    MEALS.forEach(function (m) {
      var items = dd[m.id] || [];
      if (!items.length) return;
      any = true;
      need(16);
      var tot = items.reduce(function (s, x) { return s + x.kcal; }, 0);
      font("bold", 13, INK); doc.text(m.name, L, y);
      doc.text(fmt(tot) + " kcal", R, y, { align: "right" });
      y += 6;
      font("normal", 8, MUTED);
      doc.text("Količina", 112, y, { align: "right" }); doc.text("kcal", 132, y, { align: "right" });
      doc.text("P", 152, y, { align: "right" }); doc.text("UH", 172, y, { align: "right" }); doc.text("M", R, y, { align: "right" });
      y += 2; hr(y); y += 5;
      items.forEach(function (it) {
        var name = doc.splitTextToSize(it.name, 82);
        need(name.length * 4.6 + 3);
        font("normal", 10, INK); doc.text(name, L, y);
        var qty = it.dish ? dec(it.qty) + " porc." : it.food ? fmt(it.qty) + " " + it.unit : "";
        font("normal", 9.5, MUTED); doc.text(qty, 112, y, { align: "right" });
        font("bold", 10, INK); doc.text(fmt(it.kcal), 132, y, { align: "right" });
        font("normal", 9.5, MUTED);
        if (it.p != null) {
          doc.text(dec(it.p), 152, y, { align: "right" }); doc.text(dec(it.c), 172, y, { align: "right" }); doc.text(dec(it.f), R, y, { align: "right" });
        } else doc.text("—", R, y, { align: "right" });
        y += name.length * 4.6 + 1.6;
        doc.setDrawColor(236, 240, 234); doc.setLineWidth(0.2); doc.line(L, y - 3.2, R, y - 3.2);
      });
      y += 6;
    });
    if (!any) { font("normal", 11, MUTED); doc.text(day === todayKey() ? "Danas još ništa nije uneto." : "Za ovaj dan ništa nije uneto.", L, y); y += 8; }

    // podnožje
    var pages = doc.getNumberOfPages();
    for (var i = 1; i <= pages; i++) {
      doc.setPage(i);
      font("normal", 8, MUTED);
      doc.text("Napravljeno u aplikaciji Kalorije · P = proteini, UH = ugljeni hidrati, M = masti (u gramima)", L, 290);
      if (pages > 1) doc.text(i + " / " + pages, R, 290, { align: "right" });
    }
    return doc.output("blob");
  }

  function exportMsg(t) { $("exportMsg").textContent = t || ""; }
  function fileName() { return "kalorije-" + (KDB.user ? norm(KDB.user.name) + "-" : "") + day + ".pdf"; }

  function sharePdf() {
    var blob = buildPdf();
    var file = new File([blob], fileName(), { type: "application/pdf" });
    var title = "Kalorije – " + (KDB.user ? KDB.user.name + ", " : "") + dateLabel(day);
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      return navigator.share({ files: [file], title: title }).then(function () { exportMsg(""); }, function (e) {
        if (e && e.name === "AbortError") return exportMsg("");
        openPdf(blob, "Deljenje nije uspelo, pa je PDF otvoren u novom tabu.");
      });
    }
    openPdf(blob, "Ovaj browser ne podržava deljenje fajlova, pa je PDF otvoren u novom tabu. Odatle ga podeli.");
    return Promise.resolve();
  }
  function openPdf(blob, msg) {
    var url = URL.createObjectURL(blob);
    var w = window.open(url, "_blank");
    exportMsg(w ? msg : "Browser je blokirao otvaranje PDF-a. Dozvoli iskačuće prozore za ovaj sajt i pokušaj ponovo.");
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  $("exportBtn").onclick = function () {
    var btn = this;
    if (pdfReady()) {
      try { sharePdf(); } catch (e) { exportMsg("PDF nije napravljen: " + e.message); }
      return;
    }
    // prvi put bez interneta ili sporo učitavanje: pripremi, pa traži još jedan dodir
    btn.disabled = true; $("exportLbl").textContent = "Pripremam…"; exportMsg("");
    preloadPdf().then(function () {
      $("exportLbl").textContent = "Podeli PDF"; exportMsg("PDF je spreman. Dodirni dugme ponovo da ga podeliš.");
    }, function () {
      $("exportLbl").textContent = "Izvezi"; exportMsg("Nema interneta. Pokušaj ponovo kad se povežeš.");
    }).then(function () { btn.disabled = false; });
  };
  KDB.onChange(function (what) { if (what === "auth" && KDB.user) setTimeout(function () { preloadPdf().catch(function () {}); }, 1200); });

  render();
})();
</script>
</body>
</html>
