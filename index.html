<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f5c3a">
<meta name="apple-mobile-web-app-title" content="bolja.ja">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>bolja.ja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column (max 560px) — banner, gauge, meal accordions; profile in a bottom sheet */
:root {
  --bg: #eef2ec;
  --surface: #ffffff;
  --ink: #16211a;
  --muted: #5d6b61;
  --line: #d6ded5;
  --brand: #1f5c3a;
  --brand-ink: #f2f7f1;
  --accent: #e0a526;
  --track: #dde5dc;
  --c-p: #3d82d6; --c-c: #e2a91f; --c-f: #d6453a;
  --over: #c4442f;
  --ok: #2f8a4f;
  --warn: #c98a12;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101612; --surface: #18211b; --ink: #e7eee8; --muted: #9aab9e; --line: #2a362e;
    --brand: #173f29; --brand-ink: #e9f3ea; --accent: #f0b73c; --track: #26312a;
    --over: #ec6a52; --ok: #5cc27e; --warn: #e8a92c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101612; --surface: #18211b; --ink: #e7eee8; --muted: #9aab9e; --line: #2a362e;
  --brand: #173f29; --brand-ink: #e9f3ea; --accent: #f0b73c; --track: #26312a;
  --over: #ec6a52; --ok: #5cc27e; --warn: #e8a92c; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--brand);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- banner ---------- */
.banner {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--brand); color: var(--brand-ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.banner-inner {
  max-width: 560px; margin: 0 auto; padding-block: 14px;
  display: flex; align-items: center; gap: 12px;
}
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.brand-name { font-family: var(--display); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; line-height: 1; }
.brand-name span { color: var(--accent); }
.brand-sub { font-size: 0.8rem; opacity: 0.8; margin-top: 4px; }
.avatar {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--brand-ink) 45%, transparent);
  background: color-mix(in srgb, var(--brand-ink) 12%, transparent); color: var(--brand-ink);
  display: grid; place-items: center; padding: 0; flex: none; position: relative;
}
.avatar svg { width: 24px; height: 24px; }
.avatar .dot {
  position: absolute; top: -2px; right: -2px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--brand);
}

/* ---------- main ---------- */
main {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

.daybar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daybar button {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center;
}
.daybar button:disabled { opacity: 0.35; cursor: default; }
.daylabel { text-align: center; }
.daylabel b { display: block; font-family: var(--display); font-size: 1.1rem; font-weight: 700; }
.daylabel small { color: var(--muted); font-size: 0.82rem; }
.daybar .daylabel { width: auto; height: auto; border-radius: 10px; background: none; border: 0; padding: 2px 8px; color: inherit; display: block; }

/* gauge */
.gauge-card { background: var(--surface); border-radius: 22px; padding: 18px 16px 16px; border: 1px solid var(--line); }
.gauge { position: relative; width: 100%; max-width: 340px; margin: 0 auto; }
.gauge svg { display: block; width: 100%; height: auto; }
.gauge-center {
  position: absolute; left: 0; right: 0; bottom: 2%; text-align: center; pointer-events: none;
}
.gauge-num {
  font-family: var(--display); font-weight: 800; font-size: clamp(2.6rem, 12vw, 3.4rem);
  line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
}
.gauge-unit { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }
.tick-label { fill: var(--muted); font-family: var(--body); font-size: 11px; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; text-align: center; }
.stat { padding: 8px 4px; border-radius: 10px; background: var(--bg); }
.stat b { display: block; font-family: var(--display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }
.stat.over b { color: var(--over); }
.exbtn { width: 100%; margin-top: 12px; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px;
  border: 1px dashed color-mix(in srgb, var(--ok) 55%, transparent); background: color-mix(in srgb, var(--ok) 7%, transparent); color: var(--ink); font-weight: 600; }
.exbtn svg { color: var(--ok); flex: none; }
.exbtn span { flex: 1; text-align: left; }
.exbtn b { font-family: var(--display); color: var(--ok); font-variant-numeric: tabular-nums; }
.hint {
  margin-top: 12px; font-size: 0.85rem; color: var(--muted); text-align: center;
}
.hint button { background: none; border: 0; padding: 0; color: var(--ok); font-weight: 700; text-decoration: underline; }

/* meals */
.meals { display: flex; flex-direction: column; gap: 10px; }
.meal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.meal-head {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  background: none; border: 0; text-align: left;
}
.meal-ico {
  width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--ink);
}
.meal-ico svg { width: 20px; height: 20px; }
.meal-title { flex: 1; min-width: 0; }
.meal-title b { display: block; font-weight: 700; }
.meal-title small { color: var(--muted); font-size: 0.82rem; }
.meal-kcal { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chev { transition: transform .2s; color: var(--muted); flex: none; }
.meal.open .chev { transform: rotate(180deg); }
.meal-body { padding: 0 16px 14px; border-top: 1px solid var(--line); }
.items { list-style: none; margin: 0; padding: 0; }
.items li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
.items li .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.items li .kc { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.del { border: 0; background: none; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; }
.del:hover { color: var(--over); background: var(--bg); }
.empty { color: var(--muted); font-size: 0.88rem; padding: 12px 0 4px; }
.add { display: grid; grid-template-columns: 1fr 96px auto; gap: 8px; margin-top: 6px; }
.add input { min-width: 0; }
input, select {
  width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); font-size: 16px;
}
.btn {
  border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 700;
  background: var(--brand); color: var(--brand-ink);
}
.btn.ghost { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }

/* ---------- profile sheet ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 20; background: rgba(8, 14, 10, 0.5); overflow: hidden;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; overflow-x: hidden;
  overscroll-behavior: contain; touch-action: pan-y;
  background: var(--surface); border-radius: 22px 22px 0 0;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: up .22s ease-out;
}
@media (min-width: 640px) {
  .overlay { align-items: center; }
  .sheet { border-radius: 22px; padding: 24px; }
}
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .chev { transition: none; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sheet-head h2 { margin: 0; font-family: var(--display); font-size: 1.4rem; text-wrap: balance; }
.x { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--bg); display: grid; place-items: center; }
form { display: flex; flex-direction: column; gap: 14px; }
.field label, .field .lbl { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.field { min-width: 0; }
input[type="date"] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; min-height: 46px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; position: relative; }
.seg input { position: absolute; left: 0; top: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; pointer-events: none; }
.seg label {
  display: block; text-align: center; padding: 11px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--ink); font-size: 1rem; margin: 0;
}
.seg input:checked + label { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.seg input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.err { color: var(--over); font-size: 0.88rem; min-height: 1.2em; margin: 0; }

.results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qw { gap: 6px; margin-bottom: 14px; }
.qw .lbl { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.qw-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.qw input { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.bmi-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-left: 8px; vertical-align: 3px; }
.prof-details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
.prof-details > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.prof-details > summary::-webkit-details-marker { display: none; }
.prof-details > summary b { display: block; font-weight: 700; }
.prof-details > summary span { flex: 1; min-width: 0; color: var(--muted); font-size: 0.85rem; }
.prof-details > summary .chev { transition: transform .2s; }
.prof-details[open] > summary .chev { transform: rotate(180deg); }
.prof-details[open] > form { margin-top: 12px; }
.prof-details.first { border-top: 0; margin-top: 0; padding-top: 0; }
.prof-details.first > summary { display: none; }
#results:not(:empty) { margin-bottom: 4px; }
.res { background: var(--bg); border-radius: 12px; padding: 12px; }
.res small { display: block; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }
.res b { display: block; font-family: var(--display); font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.res span { font-size: 0.85rem; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; color: #fff; }
.note { color: var(--muted); font-size: 0.8rem; margin-top: 12px; }
.export { display: flex; flex-direction: column; align-items: stretch; gap: 8px; margin-top: 6px; }
.export-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 16px; font-size: 1rem;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.export-btn:disabled { opacity: 0.6; }
.export-msg { margin: 0; text-align: center; color: var(--muted); font-size: 0.85rem; }
.export-msg:empty { display: none; }

/* banner food button */
.iconbtn {
  height: 44px; padding: 0 14px; border-radius: 22px; flex: none;
  border: 2px solid color-mix(in srgb, var(--brand-ink) 45%, transparent);
  background: color-mix(in srgb, var(--brand-ink) 12%, transparent); color: var(--brand-ink);
  display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 0.9rem;
}
.iconbtn svg { width: 20px; height: 20px; }
@media (max-width: 430px) { .icon-narrow span { display: none; } .icon-narrow { width: 44px; padding: 0; justify-content: center; } }
@media (max-width: 340px) { .iconbtn span { display: none; } .iconbtn { width: 44px; padding: 0; justify-content: center; } }
.brand-sub { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; }
#greet { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 430px) { #greet .hi { display: none; } }
.streak { display: inline-flex; align-items: center; gap: 2px; font-weight: 700; opacity: 1; color: var(--brand-ink); font-variant-numeric: tabular-nums; }
.flame { width: 16px; height: 16px; flex: none; }

/* ekipa */
.team-sum { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; }
.team { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tm { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: var(--bg); }
.tm.me { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--ok) 55%, transparent); }
.tm-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.tm-main b { font-weight: 700; }
.tm-main b small { color: var(--muted); font-weight: 500; }
.tm-main > small { color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
.tbar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.tbar i { display: block; height: 100%; border-radius: 4px; background: var(--ok); }
.tbar i.near { background: var(--warn); } .tbar i.over { background: var(--over); }
.tm-streak { display: flex; flex-direction: column; align-items: center; min-width: 44px; font-family: var(--display); font-weight: 800; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.tm-streak .flame { width: 22px; height: 22px; }
.tm-streak.off { color: var(--muted); font-weight: 600; font-size: 0.95rem; }
.tm-streak small { font-family: var(--body); font-weight: 500; font-size: 0.68rem; color: var(--muted); }

/* cigare */
.smoke-big { text-align: center; padding: 8px 0 4px; }
.smoke-big b { display: block; font-family: var(--display); font-weight: 800; font-size: 4rem; line-height: 1; color: var(--ok); font-variant-numeric: tabular-nums; }
.smoke-big p { margin: 8px 0 0; font-size: 1.15rem; font-weight: 700; }
.smoke-money { margin: 14px 0; text-align: center; padding: 14px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.smoke-money b { font-family: var(--display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.smoke-money small { display: block; color: var(--muted); }
.smoke-actions { display: flex; flex-direction: column; gap: 10px; }
.relapse { display: flex; align-items: center; justify-content: center; gap: 8px; }
.smoke-date { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.tm-smoke { color: var(--muted); }

/* težina */
.w-intro { margin: 0; color: var(--muted); }
.wsec { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.wsec h3 { margin: 0; font-family: var(--display); font-size: 1.15rem; }
.wstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.wstats div { background: var(--bg); border-radius: 12px; padding: 10px; }
.wstats small { display: block; color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; }
.wstats b { font-family: var(--display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.wchart { width: 100%; height: auto; display: block; }
.wchart .grid { stroke: var(--line); stroke-width: 1; }
.wchart .ln { fill: none; stroke: var(--ok); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.wchart .area { fill: color-mix(in srgb, var(--ok) 14%, transparent); }
.wchart .pt { fill: var(--surface); stroke: var(--ok); stroke-width: 2; }
.wchart .pt.last { fill: var(--ok); }
.wchart text { fill: var(--muted); font-family: var(--body); font-size: 10px; font-variant-numeric: tabular-nums; }

/* daily macros */
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.mac { font-size: 0.82rem; color: var(--muted); display: flex; align-items: center; gap: 6px; justify-content: center; white-space: nowrap; }
.mac b { color: var(--ink); font-variant-numeric: tabular-nums; }
.mac i, .mbox i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.p i { background: var(--c-p); } .c i { background: var(--c-c); } .f i { background: var(--c-f); }

/* meal items + actions */
.items li .nm small { display: block; color: var(--muted); font-size: 0.8rem; }
.meal-actions { display: flex; gap: 8px; margin-top: 12px; }
.meal-actions .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; }
.manual-lbl { font-size: 0.78rem; color: var(--muted); margin: 14px 0 0; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }

/* food sheet */
.food-sheet { height: 88vh; max-height: 88vh; display: flex; flex-direction: column; padding-bottom: 0; }
@media (min-width: 640px) { .food-sheet { height: 80vh; } }
.food-sheet .sheet-head { flex: none; }
.food-sheet .sheet-head h2 { flex: 1; min-width: 0; font-size: 1.25rem; }
.back { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--bg); display: grid; place-items: center; flex: none; }
#foodBody { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
.search { position: relative; margin-bottom: 8px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { padding-left: 40px; }
.group-h { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 16px 0 4px; }
.panel { --tint: var(--accent); margin: 12px 0 4px; padding: 2px 12px 2px; border-radius: 16px;
  background: color-mix(in srgb, var(--tint) 11%, var(--surface)); border: 1px solid color-mix(in srgb, var(--tint) 32%, transparent); }
.panel.mine { --tint: var(--ok); }
.panel + .panel { margin-top: 10px; }
.panel-h { display: flex; align-items: center; gap: 8px; padding: 12px 0 6px; font-family: var(--display); font-weight: 700; font-size: 1rem; color: var(--ink); }
.panel-h .pi { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--tint) 30%, transparent); color: var(--ink); }
.panel-h small { margin-left: auto; font-family: var(--body); font-weight: 600; font-size: 0.75rem; color: var(--muted);
  background: var(--surface); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.panel .flist button { border-bottom-color: color-mix(in srgb, var(--tint) 22%, transparent); }
.panel .flist li:last-child button { border-bottom: 0; }
.panel.mine .tag { display: none; }
.flist { list-style: none; margin: 0; padding: 0; }
.flist button {
  width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
  padding: 11px 2px; display: flex; align-items: center; gap: 10px;
}
.flist .fn { flex: 1; min-width: 0; }
.flist .fn b { display: block; font-weight: 600; }
.flist .fn small { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.flist .fk { font-family: var(--display); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.flist .fk small { font-family: var(--body); font-weight: 400; color: var(--muted); font-size: 0.75rem; }
.noresult { color: var(--muted); padding: 16px 0; }

.detail { display: flex; flex-direction: column; gap: 16px; }
.detail .cat { color: var(--muted); font-size: 0.85rem; }
.qty { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
.qty .inwrap { position: relative; }
.qty input { font-size: 1.4rem; font-weight: 700; padding-right: 48px; font-variant-numeric: tabular-nums; }
.qty .u { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.big { display: flex; align-items: baseline; gap: 6px; }
.big b { font-family: var(--display); font-size: 2.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.big span { color: var(--muted); }
.mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mbox { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
.mbox small { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }
.mbox b { font-family: var(--display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
/* Dobra opcija */
.k-dobra { --kc: #2f8a4f; }
.panel.good { --tint: var(--kc); }
.panel.good .ctag { display: none; }
.good-note { margin: 4px 2px 0; }
.cat .ctag { margin-left: 0; font-size: 0.78rem; }
.ctag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; vertical-align: 2px; white-space: nowrap;
  color: var(--kc); background: color-mix(in srgb, var(--kc) 14%, transparent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .k-dobra { --kc: #5cc27e; } }
:root[data-theme="dark"] .k-dobra { --kc: #5cc27e; }
.split { display: flex; flex-direction: column; gap: 6px; margin-top: -4px; }
.split-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; }
.split-bar .p { background: var(--c-p); } .split-bar .c { background: var(--c-c); } .split-bar .f { background: var(--c-f); }
.split-l { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.split-l span { display: flex; align-items: center; gap: 5px; }
.split-l i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.per100 { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.per100 th, .per100 td { padding: 7px 0; border-bottom: 1px solid var(--line); text-align: left; }
.per100 td:last-child, .per100 th:last-child { text-align: right; }
.per100 th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; }
.addrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.btn.danger { background: var(--bg); color: var(--over); border: 1px solid var(--line); }
.src { color: var(--muted); font-size: 0.78rem; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--bg); border-radius: 12px; margin-bottom: 10px; }
.tabs button { border: 0; background: none; padding: 9px; border-radius: 9px; font-weight: 700; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.newdish { width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; margin: 4px 0 4px; }
.addrow.two { grid-template-columns: 1fr 1fr; }
.per100.ing td:nth-child(2) { color: var(--muted); text-align: right; padding-right: 12px; white-space: nowrap; }
.per100.ing td:last-child { white-space: nowrap; }
.ings { list-style: none; margin: 0; padding: 0; }
.ings li { display: grid; grid-template-columns: minmax(0, 1fr) 96px auto 32px; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.ings li.empty { display: block; border: 0; }
.ings .nm { overflow-wrap: anywhere; }
.ings .inwrap { position: relative; }
.ings input { padding: 8px 30px 8px 10px; font-variant-numeric: tabular-nums; }
.ings .u { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.85rem; }
.ings .kc { color: var(--muted); font-size: 0.85rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
#bResults:empty { display: none; }
#bResults .fk { color: var(--ok); font-size: 1.4rem; }
.btotal { background: var(--bg); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; }
.btotal span { color: var(--muted); font-size: 0.85rem; }
.btotal b { font-family: var(--display); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.btotal small { grid-column: 1 / -1; color: var(--muted); font-variant-numeric: tabular-nums; }
#foodList > .newdish:first-child { margin-top: 6px; }
.tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-size: 0.7rem; font-weight: 600; vertical-align: 2px;
  background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--ink); max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag.mine { background: color-mix(in srgb, var(--ok) 22%, transparent); }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.unitin { position: relative; }
.unitin input { padding-right: 44px; }
.unitin .u { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.85rem; }
.dup { color: var(--warn); font-size: 0.82rem; margin-top: 6px; }
.dup:empty { display: none; }
.missing { color: var(--muted); font-style: italic; }
.acct { display: flex; flex-direction: column; gap: 8px; background: var(--bg); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 0.9rem; }
.acct span { color: var(--muted); }
.acct b { color: var(--ink); display: block; }
.acct.in { flex-direction: row; align-items: center; }
.acct.in span { flex: 1; min-width: 0; }
.acct + .err { margin: -8px 0 12px; }
.login { position: fixed; inset: 0; z-index: 40; background: var(--brand); display: grid; place-items: center; overflow-y: auto;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.login-card { width: 100%; max-width: 380px; background: var(--surface); border-radius: 22px; padding: 28px 22px; gap: 16px; }
.login-card p { margin: 0; color: var(--muted); }
.login-card p.err { color: var(--over); }
.login-logo { font-family: var(--display); font-weight: 800; font-size: 2.2rem; letter-spacing: -0.02em; line-height: 1; color: var(--ink); }
.login-logo span { color: var(--accent); }
.ava { width: 40px; height: 40px; border-radius: 50%; flex: none !important; display: grid; place-items: center; background: var(--brand); color: var(--brand-ink) !important; font-family: var(--display); font-weight: 700; font-size: 1.1rem; }
</style>
</head>
<body>

<header class="banner">
  <div class="banner-inner">
    <div class="brand">
      <div class="brand-name">bolja<span>.</span>ja</div>
      <div class="brand-sub"><span id="greet"></span><span class="streak" id="streakBadge" hidden title="Niz dana sa unetim obrocima"><svg class="flame" viewBox="0 0 24 24" aria-hidden="true"><path fill="#f07a1a" d="M12.6 2.2c.5 3 3.5 4.7 4.8 7.6 1.7 3.9-.6 9-5 9-4.2 0-6.7-3.3-5.6-6.9.4-1.5 1.4-2.6 2.4-3.3-.1 1.7.7 2.9 1.8 3.3-.7-3.7.4-6.8 1.6-9.7z"/><path fill="#ffc53d" d="M12.3 11.6c.3 1.5 1.8 2.3 2.3 3.8.6 1.9-.6 3.8-2.6 3.8s-3.1-1.6-2.6-3.2c.2-.7.7-1.2 1.2-1.5 0 .8.4 1.3.9 1.5-.2-1.6.3-3.1.8-4.4z"/></svg><b id="streakNum">0</b></span></div>
    </div>
    <button class="iconbtn icon-narrow" id="openTeam" aria-label="Ekipa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5a4 4 0 005.66 0l3.2-3.2a4 4 0 00-5.66-5.66l-1.1 1.1"/><path d="M13.5 10.5a4 4 0 00-5.66 0l-3.2 3.2a4 4 0 005.66 5.66l1.1-1.1"/></svg>
      <span>Ekipa</span>
    </button>
    <button class="iconbtn icon-narrow" id="openSmoke" aria-label="Bez cigare" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="14" width="15" height="4" rx="1"/><path d="M13 14v4M19.5 14v4M22 14v4M18 10c0-1.5 1.5-1.5 1.5-3S18 5.5 18 4M21 10c0-1.5 1.5-1.5 1.5-3S21 5.5 21 4"/></svg>
      <span>Cigare</span>
    </button>
    <button class="iconbtn icon-narrow" id="openFoods" aria-label="Namirnice i jela">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span>Namirnice</span>
    </button>
    <button class="avatar" id="openProfile" aria-label="Moj profil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      <span class="dot" id="profileDot"></span>
    </button>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="daybar">
      <button id="prevDay" aria-label="Prethodni dan"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="daylabel" id="dayLabel" type="button" aria-label="Vrati na danas"><b id="dayName">Danas</b><small id="dayDate"></small></button>
      <button id="nextDay" aria-label="Sledeći dan"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>

    <section class="gauge-card" aria-label="Dnevni unos kalorija">
      <div class="gauge">
        <svg id="gaugeSvg" viewBox="-28 4 356 178"role="img" aria-labelledby="gaugeLabel">
          <title id="gaugeLabel">Unete kalorije</title>
          <path id="gTrack" fill="none" stroke="var(--track)" stroke-width="22" stroke-linecap="round"/>
          <path id="gFill" fill="none" stroke="var(--ok)" stroke-width="22" stroke-linecap="round"/>
          <g id="gTicks"></g>
        </svg>
        <div class="gauge-center">
          <div class="gauge-num" id="gNum">0</div>
          <div class="gauge-unit" id="gUnit">od 2000 kcal</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><b id="sGoal">2000</b><small>Cilj</small></div>
        <div class="stat"><b id="sEaten">0</b><small>Uneto</small></div>
        <div class="stat" id="sLeftBox"><b id="sLeft">2000</b><small id="sLeftLbl">Preostalo</small></div>
      </div>
      <div class="macros">
        <div class="mac p"><i></i>Proteini <b id="mP">0 g</b></div>
        <div class="mac c"><i></i>UH <b id="mC">0 g</b></div>
        <div class="mac f"><i></i>Masti <b id="mF">0 g</b></div>
      </div>
      <button class="exbtn" id="exBtn" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg><span id="exLbl">Dodaj vežbanje</span><b id="exVal"></b></button>
      <p class="hint" id="hint">Cilj je privremeno 2.000 kcal. <button id="hintBtn">Popuni profil</button> da izračunamo tvoju potrošnju.</p>
    </section>

    <section class="meals" id="meals" aria-label="Obroci"></section>

    <section class="export" aria-label="Izvoz">
      <button class="btn export-btn" id="exportBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 002 2h10a2 2 0 002-2v-5"/></svg>
        <span id="exportLbl">Izvezi</span>
      </button>
      <p class="export-msg" id="exportMsg"></p>
    </section>
  </div>
</main>

<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <div class="login-logo">bolja<span>.</span>ja</div>
    <p>Dobrodošao/la. Upiši svoje korisničko ime da uđeš.</p>
    <div class="field"><label for="username">Korisničko ime</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="npr. Ime1234"></div>
    <p class="err" id="loginErr"></p>
    <button class="btn" type="submit" id="loginBtn">Uđi</button>
  </form>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">Moj profil</h2>
      <button class="x" id="closeProfile" aria-label="Zatvori"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="account"></div>
    <form class="qw" id="qwForm" novalidate hidden>
      <label class="lbl" for="qwIn">Težina danas</label>
      <div class="qw-row"><div class="inwrap unitin"><input id="qwIn" type="text" inputmode="decimal" autocomplete="off"><span class="u">kg</span></div>
        <button class="btn" type="submit">Sačuvaj</button></div>
      <p class="err" id="qwErr"></p>
    </form>
    <div id="results"></div>
    <div id="weightSection"></div>
    <details class="prof-details" id="profDetails">
      <summary id="profSummary"></summary>
      <form id="profileForm" novalidate>
        <div class="field">
          <span class="lbl">Pol</span>
          <div class="seg">
            <input type="radio" name="sex" id="sexM" value="m"><label for="sexM">Muško</label>
            <input type="radio" name="sex" id="sexF" value="f"><label for="sexF">Žensko</label>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label for="height">Visina (cm)</label><input id="height" type="number" inputmode="numeric" min="100" max="250" placeholder="180"></div>
          <div class="field" id="weightField"><label for="weight">Težina (kg)</label><input id="weight" type="text" inputmode="decimal" autocomplete="off" placeholder="80"></div>
        </div>
        <div class="field"><label for="dob">Datum rođenja</label><input id="dob" type="date"></div>
        <div class="field">
          <label for="activity">Koliko si fizički aktivan nedeljno?</label>
          <select id="activity">
            <option value="1.2">Sedentarno – kancelarija, bez treninga</option>
            <option value="1.375">Lagano – trening 1–3 dana nedeljno</option>
            <option value="1.55">Umereno – trening 3–5 dana nedeljno</option>
            <option value="1.725">Aktivno – trening 6–7 dana nedeljno</option>
            <option value="1.9">Veoma aktivno – fizički posao ili 2 treninga dnevno</option>
          </select>
        </div>
        <p class="err" id="err"></p>
        <button class="btn" type="submit" id="profSave">Izračunaj i sačuvaj</button>
      </form>
    </details>
  </div>
</div>

<div class="overlay" id="teamOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="teamTitle">
    <div class="sheet-head">
      <h2 id="teamTitle">Ekipa</h2>
      <button class="x" id="teamClose" aria-label="Zatvori"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="teamBody"></div>
  </div>
</div>

<div class="overlay" id="exOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <div class="sheet-head">
      <h2 id="exTitle">Vežbanje</h2>
      <button class="x" id="exClose" aria-label="Zatvori"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <form id="exForm" novalidate>
      <p class="w-intro"></p>
      <div class="field"><label for="exIn">Potrošeno vežbanjem</label>
        <div class="qty"><div class="inwrap"><input id="exIn" type="text" inputmode="numeric" autocomplete="off" placeholder="0"><span class="u">kcal</span></div></div></div>
      <div class="chips" id="exChips"></div>
      <p class="err" id="exErr"></p>
      <button class="btn" type="submit">Sačuvaj</button>
      <button class="btn danger" type="button" id="exDel" hidden>Ukloni vežbanje</button>
    </form>
  </div>
</div>

<div class="overlay" id="smokeOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="smokeTitle">
    <div class="sheet-head">
      <h2 id="smokeTitle">Bez cigare</h2>
      <button class="x" id="smokeClose" aria-label="Zatvori"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="smokeBody"></div>
  </div>
</div>

<div class="overlay" id="weightOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="weightTitle">
    <div class="sheet-head">
      <h2 id="weightTitle">Merenje</h2>
      <button class="x" id="weightClose" aria-label="Zatvori"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <form id="weightForm" novalidate>
      <p class="w-intro" id="weightIntro"></p>
      <div class="field"><label for="wIn">Težina danas (kg)</label>
        <div class="qty"><div class="inwrap"><input id="wIn" type="text" inputmode="decimal" autocomplete="off"><span class="u">kg</span></div></div></div>
      <p class="err" id="wErr"></p>
      <button class="btn" type="submit">Sačuvaj merenje</button>
      <button class="btn ghost" type="button" id="wLater">Podseti me sutra</button>
    </form>
  </div>
</div>

<div class="overlay" id="foodOverlay" hidden>
  <div class="sheet food-sheet" role="dialog" aria-modal="true" aria-labelledby="foodTitle">
    <div class="sheet-head">
      <button class="back" id="foodBack" aria-label="Nazad" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2 id="foodTitle">Namirnice</h2>
      <button class="x" id="foodClose" aria-label="Zatvori"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="foodBody"></div>
  </div>
</div>

  var day = todayKey();
  var openMeals = {};

  function emptyState() { return { profile: null, days: {}, recent: [], recentDishes: [], streak: null, best: 0, weights: null, smoke: null }; }
  function fill(x) {
    x.days = x.days || {};
    Object.keys(x.days).forEach(function (k) {
      var dd = x.days[k];
      if (dd && dd.ostalo) { dd.uzine = (dd.uzine || []).concat(dd.ostalo); delete dd.ostalo; }
    }); x.recent = x.recent || []; x.recentDishes = x.recentDishes || []; x.profile = x.profile || null;
    x.streak = x.streak || null; x.best = x.best || 0; x.weights = x.weights || null; x.smoke = x.smoke || null;
    return x;
  }
  function userKey() { return KEY_BASE + "." + KDB.user.id; }
  function loadLocal() {
    try { var x = JSON.parse(localStorage.getItem(userKey())); if (x && x.days) return fill(x); } catch (e) {}
    return emptyState();
  }
  // Dok se lični podaci ne učitaju iz baze, izmene se pamte lokalno i šalju tek posle,
  // spojene sa onim iz baze (inače bi prazan profil sa novog telefona prepisao pravi).
  var personalReady = false, dirtyDays = {}, metaDirty = false;
  function save() {
    if (!KDB.user) return;
    try { localStorage.setItem(userKey(), JSON.stringify(state)); } catch (e) {}
    if (personalReady) KDB.savePersonal(state, [day], teamDoc());
    else { dirtyDays[day] = true; metaDirty = true; }
  }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(n) { return Math.round(n).toLocaleString("sr-RS"); }
  function dec(n) { return (Math.round(n * 10) / 10).toLocaleString("sr-RS", { maximumFractionDigits: 1 }); }

  // ---------- dates ----------
  function keyOf(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function todayKey() { return keyOf(new Date()); }
  function parseKey(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function shift(k, n) { var d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
  var DAYS = ["nedelja", "ponedeljak", "utorak", "sreda", "četvrtak", "petak", "subota"];
  var MONTHS = ["januar", "februar", "mart", "april", "maj", "jun", "jul", "avgust", "septembar", "oktobar", "novembar", "decembar"];

  // ---------- formulas ----------
  // Mifflin-St Jeor (1990): BMR = 10·kg + 6.25·cm − 5·god + 5 (muškarci) / −161 (žene)
  function age(dob) {
    var b = new Date(dob), n = new Date();
    var a = n.getFullYear() - b.getFullYear();
    if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
    return a;
  }
  function calc(p) {
    var a = age(p.dob);
    var bmr = 10 * p.weight + 6.25 * p.height - 5 * a + (p.sex === "m" ? 5 : -161);
    var tdee = bmr * p.activity;
    var bmi = p.weight / Math.pow(p.height / 100, 2);
    return { age: a, bmr: bmr, tdee: tdee, bmi: bmi };
  }
  function bmiCat(b) {
    if (b < 18.5) return { t: "Pothranjenost", c: "#5b8fd6" };
    if (b < 25) return { t: "Normalna težina", c: "#3aa35f" };
    if (b < 30) return { t: "Prekomerna težina", c: "#c98a12" };
    return { t: "Gojaznost", c: "#c4442f" };
  }
  // Cilj: za korisnike sa cilj: "mrsavljenje" (korisnici.js) potrošnja − 500 kcal (~0,5 kg nedeljno),
  // ali ne ispod 1.200 (žene) / 1.500 (muškarci); ostali održavanje = potrošnja.
  function me() { var id = KDB.user && KDB.user.id; return (window.KORISNICI || []).filter(function (u) { return u.id === id; })[0] || {}; }
  function losing() { return me().cilj === "mrsavljenje"; }
  function goal() {
    if (!state.profile) return 2000;
    var t = Math.round(calc(state.profile).tdee);
    return losing() ? Math.max(state.profile.sex === "m" ? 1500 : 1200, t - 500) : t;
  }
  // Proteini: 1,8 g/kg pri mršavljenju (čuva mišiće), 1,6 g/kg inače; pri visokom BMI računa se
  // najviše kilaža koja odgovara BMI 27. Zaokruženo na 5 g.
  function proteinGoal() {
    var p = state.profile; if (!p) return 0;
    var hm = p.height / 100, w = Math.min(p.weight, 27 * hm * hm);
    return Math.round(w * (losing() ? 1.8 : 1.6) / 5) * 5;
  }

  // ---------- gauge ----------
  var CX = 150, CY = 150, R = 104;
  function pt(frac, r) { var a = Math.PI * (1 - frac); return [CX + r * Math.cos(a), CY - r * Math.sin(a)]; }
  function arc(f0, f1, r) {
    var a = pt(f0, r), b = pt(f1, r);
    return "M" + a[0].toFixed(2) + " " + a[1].toFixed(2) + " A" + r + " " + r + " 0 0 1 " + b[0].toFixed(2) + " " + b[1].toFixed(2);
  }
  $("gTrack").setAttribute("d", arc(0, 1, R));
  var shownFrac = 0;
  function drawGauge(eaten, g) {
    var max = g * 1.25;                // skala ide do 125% cilja
    var frac = Math.min(eaten / max, 1);
    var goalFrac = g / max;            // 0.8
    var color = eaten > g ? "var(--over)" : eaten > g * 0.9 ? "var(--warn)" : "var(--ok)";
    var ticks = "";
    [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
      var v = Math.round(max * f / 100) * 100;
      var o = pt(f, R + 20), i1 = pt(f, R - 15), i2 = pt(f, R - 22);
      ticks += '<line x1="' + i1[0] + '" y1="' + i1[1] + '" x2="' + i2[0] + '" y2="' + i2[1] + '" stroke="var(--muted)" stroke-width="1.5"/>';
      ticks += '<text class="tick-label" x="' + o[0] + '" y="' + (f === 0.5 ? o[1] - 2 : o[1] + 4) + '" text-anchor="' + (f < 0.4 ? "end" : f > 0.6 ? "start" : "middle") + '">' + (f === 0 ? "0" : fmt(v)) + "</text>";
    });
    var gp1 = pt(goalFrac, R + 13), gp2 = pt(goalFrac, R - 13);
    ticks += '<line x1="' + gp1[0] + '" y1="' + gp1[1] + '" x2="' + gp2[0] + '" y2="' + gp2[1] + '" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>';
    $("gTicks").innerHTML = ticks;
    var arcEl = $("gFill");
    arcEl.setAttribute("stroke", color);
    var start = shownFrac, end = frac, t0 = null;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function step(ts) {
      if (t0 === null) t0 = ts;
      var k = reduce ? 1 : Math.min((ts - t0) / 600, 1);
      var e = 1 - Math.pow(1 - k, 3);
      var f = start + (end - start) * e;
      if (f > 0.002) { arcEl.setAttribute("d", arc(0, f, R)); arcEl.style.display = ""; } else arcEl.style.display = "none";
      shownFrac = f;
      if (k < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // ---------- render ----------
  function dayData() { return state.days[day] || {}; }
  function mealTotal(id) { return (dayData()[id] || []).reduce(function (s, x) { return s + x.kcal; }, 0); }

  function render() {
    var d = parseKey(day), t = todayKey();
    $("dayName").textContent = day === t ? "Danas" : day === shift(t, -1) ? "Juče" : DAYS[d.getDay()].replace(/^./, function (c) { return c.toUpperCase(); });
    $("dayDate").textContent = DAYS[d.getDay()] + ", " + d.getDate() + ". " + MONTHS[d.getMonth()] + " " + d.getFullYear() + ".";
    $("nextDay").disabled = day >= t;
    $("prevDay").disabled = day <= windowStart();
    var sk = updateStreak();
    $("streakBadge").hidden = !KDB.user || sk.count < 1;
    $("openSmoke").hidden = !smokeUser();
    $("streakNum").textContent = sk.count;

    var burned = burnedOn(day), g = goal();   // vežbanje je bonus, ne menja cilj
    var eaten = MEALS.reduce(function (s, m) { return s + mealTotal(m.id); }, 0);
    $("gNum").textContent = fmt(eaten);
    $("gUnit").textContent = "od " + fmt(g) + " kcal";
    $("exLbl").textContent = burned ? "Vežbanje · bonus" : "Dodaj vežbanje";
    $("exVal").textContent = burned ? fmt(burned) + " kcal" : "";
    $("sGoal").textContent = fmt(g);
    $("sEaten").textContent = fmt(eaten);
    var left = g - eaten;
    $("sLeft").textContent = fmt(Math.abs(left));
    $("sLeftLbl").textContent = left < 0 ? "Preko" : "Preostalo";
    $("sLeftBox").classList.toggle("over", left < 0);
    $("hint").hidden = !!state.profile;
    $("profileDot").hidden = !!state.profile;
    $("greet").innerHTML = KDB.user ? '<span class="hi">Zdravo, </span>' + esc(KDB.user.name) : "";
    drawGauge(eaten, g);
    var mac = { p: 0, f: 0, c: 0 };
    MEALS.forEach(function (m) { (dayData()[m.id] || []).forEach(function (it) { mac.p += it.p || 0; mac.f += it.f || 0; mac.c += it.c || 0; }); });
    $("mP").textContent = fmt(mac.p) + (proteinGoal() ? " / " + proteinGoal() : "") + " g"; $("mF").textContent = fmt(mac.f) + " g"; $("mC").textContent = fmt(mac.c) + " g";

    var html = "";
    MEALS.forEach(function (m) {
      var items = dayData()[m.id] || [];
      var open = !!openMeals[m.id];
      html += '<div class="meal' + (open ? " open" : "") + '">' +
        '<button class="meal-head" data-toggle="' + m.id + '" aria-expanded="' + open + '">' +
          '<span class="meal-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + m.icon + '</svg></span>' +
          '<span class="meal-title"><b>' + m.name + '</b><small>' + (items.length ? items.length + (items.length === 1 ? " stavka" : items.length < 5 ? " stavke" : " stavki") : "Ništa uneto") + '</small></span>' +
          '<span class="meal-kcal">' + fmt(mealTotal(m.id)) + ' kcal</span>' +
          '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>' +
        '</button>';
      if (open) {
        html += '<div class="meal-body">';
        if (items.length) {
          html += '<ul class="items">';
          items.forEach(function (it, i) {
            var sub = it.food || it.dish ? (it.dish ? "jelo · " + dec(it.qty) + " porc." : fmt(it.qty) + " " + it.unit) + " · P " + dec(it.p) + " · UH " + dec(it.c) + " · M " + dec(it.f) : "ručni unos";
            html += '<li data-edit="' + m.id + ':' + i + '"><span class="nm">' + esc(it.name) + '<small>' + sub + '</small></span><span class="kc">' + fmt(it.kcal) + ' kcal</span>' +
              '<button class="del" data-del="' + m.id + ':' + i + '" aria-label="Obriši ' + esc(it.name) + '"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></li>';
          });
          html += '</ul>';
        } else {
          html += '<p class="empty">Još ništa za ' + m.acc + '. Izaberi iz liste ili upiši ručno.</p>';
        }
        html += '<div class="meal-actions"><button class="btn" data-pick="' + m.id + '"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Dodaj iz liste</button></div>';
        html += '<p class="manual-lbl">Ili ručno</p><form class="add" data-add="' + m.id + '">' +
          '<input id="n-' + m.id + '" name="name" placeholder="npr. Burek sa sirom" autocomplete="off" aria-label="Naziv">' +
          '<input id="k-' + m.id + '" name="kcal" type="number" inputmode="numeric" min="0" placeholder="kcal" aria-label="Kalorije">' +
          '<button class="btn" type="submit" aria-label="Dodaj">+</button></form>';
        html += '</div>';
      }
      html += '</div>';
    });
    $("meals").innerHTML = html;
  }

  $("meals").addEventListener("click", function (e) {
    var t = e.target.closest("[data-toggle]");
    if (t) { var id = t.getAttribute("data-toggle"); var was = !!openMeals[id]; openMeals = {}; if (!was) openMeals[id] = true; render(); return; }
    var pk = e.target.closest("[data-pick]");
    if (pk) { openFoods("pick", { meal: pk.getAttribute("data-pick") }); return; }
    var d = e.target.closest("[data-del]");
    if (d) {
      var p = d.getAttribute("data-del").split(":");
      var list = (state.days[day] || {})[p[0]];
      if (list) { list.splice(+p[1], 1); save(); render(); }
      return;
    }
    var ed = e.target.closest("[data-edit]");
    if (ed) { var q = ed.getAttribute("data-edit").split(":"); openFoods("edit", { meal: q[0], index: +q[1] }); }
  });
  $("meals").addEventListener("submit", function (e) {
    var f = e.target.closest("[data-add]");
    if (!f) return;
    e.preventDefault();
    var id = f.getAttribute("data-add");
    var name = f.elements.name.value.trim();
    var kcal = parseFloat(f.elements.kcal.value);
    if (!name) { f.elements.name.focus(); return; }
    if (!(kcal >= 0)) { f.elements.kcal.focus(); return; }
    state.days[day] = state.days[day] || {};
    (state.days[day][id] = state.days[day][id] || []).push({ name: name, kcal: Math.round(kcal) });
    save(); render();
    var n = $("n-" + id); if (n) n.focus();
  });

  $("prevDay").onclick = function () { if (day > windowStart()) { day = shift(day, -1); openMeals = {}; render(); } };
  $("nextDay").onclick = function () { if (day < todayKey()) { day = shift(day, 1); openMeals = {}; render(); } };
  $("dayLabel").onclick = function () { if (day !== todayKey()) { day = todayKey(); openMeals = {}; render(); } };

  // posle ponoći: ako je bio otvoren "danas", aplikacija sama pređe na novi dan
  var lastToday = todayKey();
  function checkNewDay() {
    var t = todayKey();
    if (t === lastToday) return;
    if (day === lastToday || day < windowStart()) { day = t; openMeals = {}; }
    lastToday = t;
    if (KDB.user && personalReady) { KDB.deleteDays(pruneDays()); render(); maybeAskWeight(); }
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") checkNewDay(); });
  window.addEventListener("focus", checkNewDay);
  setInterval(checkNewDay, 60000);

  // ---------- profile ----------
  var ACT = { "1.2": "bez treninga", "1.375": "trening 1–3 dana", "1.55": "trening 3–5 dana", "1.725": "trening 6–7 dana", "1.9": "veoma aktivno" };
  // Kad je profil popunjen: gore samo kilaža, BMI i potrošnja; "Moji podaci" su skupljeni.
  function openSheet() {
    var p = state.profile;
    if (p) {
      $(p.sex === "m" ? "sexM" : "sexF").checked = true;
      $("height").value = p.height; $("weight").value = dec(p.weight); $("dob").value = p.dob;
      $("activity").value = String(p.activity);
      $("qwIn").value = dec(p.weight);
      $("profSummary").innerHTML = '<span><b>Moji podaci</b>' + (p.sex === "m" ? "Muško" : "Žensko") + " · " + p.height + " cm · " +
        age(p.dob) + " god. · " + (ACT[String(p.activity)] || "") + '</span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
      showResults(p);
    } else {
      $("results").innerHTML = "";
      $("profileForm").reset();
    }
    $("qwForm").hidden = !p;
    $("weightField").hidden = !!p;          // težina se posle unosi gore, kao merenje
    $("profDetails").classList.toggle("first", !p);
    $("profDetails").open = !p;
    $("profSave").textContent = p ? "Sačuvaj podatke" : "Izračunaj i sačuvaj";
    $("qwErr").textContent = "";
    $("err").textContent = "";
    renderWeightSection();
    $("overlay").hidden = false;
    document.body.style.overflow = "hidden";
  }
  function closeSheet() { $("overlay").hidden = true; document.body.style.overflow = ""; }
  $("openProfile").onclick = openSheet;
  $("hintBtn").onclick = openSheet;
  $("closeProfile").onclick = closeSheet;
  $("overlay").addEventListener("click", function (e) { if (e.target === this) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("overlay").hidden) closeSheet(); });

  $("profileForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var sex = (document.querySelector('input[name="sex"]:checked') || {}).value;
    var h = parseFloat($("height").value), w = parseFloat(String($("weight").value).replace(",", ".")), dob = $("dob").value;
    var err = "";
    if (!sex) err = "Izaberi pol.";
    else if (!(h >= 100 && h <= 250)) err = "Unesi visinu između 100 i 250 cm.";
    else if (!(w >= 30 && w <= 300)) err = "Unesi težinu između 30 i 300 kg.";
    else if (!dob || isNaN(new Date(dob)) || age(dob) < 10 || age(dob) > 110) err = "Unesi ispravan datum rođenja.";
    $("err").textContent = err;
    if (err) return;
    state.profile = { sex: sex, height: h, weight: w, dob: dob, activity: parseFloat($("activity").value) };
    seedWeight();
    save(); render(); openSheet();          // posle čuvanja se podaci skupe
  });

  $("qwForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var kg = parseFloat(String($("qwIn").value).replace(",", "."));
    if (!(kg >= 30 && kg <= 300)) { $("qwErr").textContent = "Unesi težinu između 30 i 300 kg."; return; }
    addWeight(Math.round(kg * 10) / 10);
    openSheet();
  });

  function showResults(p) {
    var r = calc(p), c = bmiCat(r.bmi);
    $("results").innerHTML =
      '<div class="results">' +
        '<div class="res"><small>BMI</small><b>' + r.bmi.toFixed(1).replace(".", ",") + '<i class="bmi-dot" style="background:' + c.c + '" title="' + c.t + '"></i></b><span>' + c.t + '</span></div>' +
        '<div class="res"><small>Dnevni cilj</small><b>' + fmt(goal()) + '</b><span>kcal · proteini ' + proteinGoal() + ' g</span></div>' +
      '</div>' +
      '<p class="note">Potrošnja sa aktivnošću je ' + fmt(r.tdee) + ' kcal (Mifflin-St Jeor). ' +
        (losing() ? "Cilj je 500 kcal manje, za gubitak oko 0,5 kg nedeljno. Proteini 1,8 g po kg čuvaju mišiće dok se gubi mast."
                  : "Cilj je održavanje težine. Proteini 1,6 g po kg.") + '</p>';
  }


  // ---------- namirnice i jela ----------
  // Dve vrste: standardna lista (foods.js, jela.js — niko ne briše) i zajednička (KDB, od korisnika).
  var STD_FOODS = (window.FOODS || []).map(function (f) { return Object.assign({ std: true }, f); });
  var STD_DISHES = (window.JELA || []).map(function (d) { return Object.assign({ std: true }, d); });
  var FOOD_BY_ID = {}, DISH_BY_ID = {};

  function comFoods() { return (KDB.foods || []).slice().sort(byName); }
  function comDishes() { return (KDB.dishes || []).slice().sort(byName); }
  function byName(a, b) { return a.name.localeCompare(b.name, "sr"); }
  function allFoods() { return STD_FOODS.concat(comFoods()); }
  function allDishes() { return STD_DISHES.concat(comDishes()); }
  function reindex() {
    FOOD_BY_ID = {}; DISH_BY_ID = {};
    allFoods().forEach(function (f) { FOOD_BY_ID[f.id] = f; });
    allDishes().forEach(function (d) { DISH_BY_ID[d.id] = d; });
  }
  reindex();
  function dishById(id) { return DISH_BY_ID[id] || null; }
  function isMine(x) { return !x.std && KDB.isMine(x); }
  function author(x) { return x.std ? "Standardna lista" : "Dodao/la: " + (KDB.isMine(x) ? "ti" : (x.createdByName || "korisnik")); }
  var CATS = [];
  STD_FOODS.forEach(function (f) { if (CATS.indexOf(f.cat) === -1) CATS.push(f.cat); });
  CATS.push("Ostalo");

  function norm(s) {
    return String(s).toLowerCase().replace(/đ/g, "dj").replace(/[čć]/g, "c").replace(/š/g, "s").replace(/ž/g, "z")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }
  function macrosFor(f, qty) {
    var k = qty / 100;
    return { kcal: f.kcal * k, p: f.p * k, f: f.f * k, c: f.c * k };
  }
  function dishTotals(d) {
    var t = { kcal: 0, p: 0, f: 0, c: 0, n: 0 };
    d.items.forEach(function (x) {
      var f = FOOD_BY_ID[x[0]]; if (!f) return;
      var m = macrosFor(f, x[1]); t.kcal += m.kcal; t.p += m.p; t.f += m.f; t.c += m.c; t.n++;
    });
    return t;
  }

  var fs = { view: null };
  function openFoods(mode, opts) {
    opts = opts || {};
    fs = { mode: mode, meal: opts.meal || null, index: opts.index == null ? null : opts.index, view: "list", tab: "foods", query: "" };
    if (mode === "edit") {
      var it = (state.days[day] || {})[fs.meal][fs.index];
      var dsh = it.dish && dishById(it.dish);
      if (it.food && FOOD_BY_ID[it.food]) { fs.view = "detail"; fs.food = FOOD_BY_ID[it.food]; fs.qty = it.qty; }
      else if (dsh) { fs.view = "dish"; fs.dish = dsh; fs.portions = it.qty; }
      else { fs.view = "manual"; fs.item = it; }
    }
    $("foodOverlay").hidden = false;
    document.body.style.overflow = "hidden";
    renderFoods(true);
  }
  function closeFoods() { $("foodOverlay").hidden = true; document.body.style.overflow = ""; fs.view = null; }

  var ICON_SEARCH = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>';

  function tag(x) { return x.std ? "" : '<span class="tag' + (KDB.isMine(x) ? " mine" : "") + '">' + (KDB.isMine(x) ? "moje" : esc(x.createdByName || "korisnik")) + '</span>'; }

      '<span class="fk">' + fmt(f.kcal) + ' <small>kcal</small></span></button></li>';
  }
  // standardna jela sa cat: "Dobra opcija" izdvojena su na vrhu liste jela
  var GOOD = "Dobra opcija";
  function isGood(d) { return !!d.std && d.cat === GOOD; }
  function ctag(d) { return isGood(d) ? '<span class="ctag k-dobra">' + GOOD + '</span>' : ""; }
  function dishRow(d) {
    var t = dishTotals(d);
    return '<li><button data-dish="' + esc(d.id) + '"><span class="fn"><b>' + esc(d.name) + tag(d) + ctag(d) + '</b><small>' + t.n + (t.n === 1 ? " namirnica" : " namirnice") +
      ' · P ' + fmt(t.p) + ' · UH ' + fmt(t.c) + ' · M ' + fmt(t.f) + '</small></span>' +
      '<span class="fk">' + fmt(t.kcal) + ' <small>kcal</small></span></button></li>';
  }
  function matches(q) {
    var words = q.split(/\s+/);
    return function (text) { var n = norm(text); return words.every(function (w) { return n.indexOf(w) !== -1; }); };
  }
  function ul(list, fn) { return '<ul class="flist">' + list.map(fn).join("") + '</ul>'; }
  function addButton(kind) {
    if (!KDB.canAdd()) return "";
    return kind === "food"
      ? '<button class="btn newdish" data-newfood="1">' + ICON_PLUS + 'Dodaj novu namirnicu</button>'
      : '<button class="btn newdish" data-newdish="1">' + ICON_PLUS + 'Napravi novo jelo</button>';
  }

  var ICON_CLOCK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  var ICON_LEAF = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 15-14-1 10-6 15-14 15"/><path d="M5 19c3-4 6-6 9-7"/></svg>';
  var ICON_USER = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>';
  function panel(cls, icon, title, list, fn) {
    return '<section class="panel ' + cls + '"><div class="panel-h"><span class="pi">' + icon + '</span>' + title +
      '<small>' + list.length + '</small></div>' + ul(list, fn) + '</section>';
  }
  // poredak u pretrazi: nedavno → moje → počinje upisanim tekstom → ostalo
  function ranker(q, recentIds) {
    return function (x) {
      var r = recentIds.indexOf(x.id);
      if (r !== -1) return r;
      if (isMine(x)) return 100;
      return norm(x.name).indexOf(q) === 0 ? 200 : 300;
    };
  }
  function sortBy(list, score) { return list.map(function (x, i) { return [score(x), i, x]; }).sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; }).map(function (r) { return r[2]; }); }

  function renderList() {
    if (!$("foodList")) return;
    var q = norm(fs.query.trim()), html = "";
    var b = document.querySelectorAll("[data-tab]");
    for (var i = 0; i < b.length; i++) b[i].setAttribute("aria-selected", b[i].getAttribute("data-tab") === fs.tab);
    var foods = fs.tab === "foods";
    $("foodSearch").placeholder = foods ? "Pretraži, npr. jaje, piletina, hleb" : "Pretraži jela";
    var fn = foods ? row : dishRow;
    var std = foods ? STD_FOODS : STD_DISHES;
    var com = foods ? comFoods() : comDishes();
    var recentIds = foods ? state.recent : state.recentDishes;
    var lookup = foods ? function (id) { return FOOD_BY_ID[id]; } : dishById;

    html += addButton(foods ? "food" : "dish");
    if (q) {
      var m = matches(q);
      var hits = std.concat(com).filter(function (x) { return m(x.name + " " + (x.cat || "")); });
      hits = sortBy(hits, ranker(q, recentIds));
      html += hits.length ? ul(hits, fn) : '<p class="noresult">Nema ' + (foods ? "namirnice" : "jela") + ' „' + esc(fs.query) + '“. ' + (foods ? "Dodaj je" : "Napravi ga") + ' dugmetom iznad.</p>';
    } else {
      var recent = recentIds.map(lookup).filter(Boolean).slice(0, 8);
      var mine = com.filter(isMine);
      var others = com.filter(function (x) { return !isMine(x); });
      if (recent.length) html += panel("recent", ICON_CLOCK, "Nedavno dodato", recent, fn);
      if (mine.length) html += panel("mine", ICON_USER, foods ? "Moje namirnice" : "Moja jela", mine, fn);
      var good = foods ? [] : std.filter(isGood);
      if (good.length) html += panel("good k-dobra", ICON_LEAF, GOOD, good, dishRow) +
        '<p class="src good-note">Zdrava i izbalansirana jela koja se lako naprave kod kuće.</p>';
      if (others.length || !mine.length) {
        html += '<div class="group-h">Od drugih korisnika</div>' +
          (others.length ? ul(others, fn) : '<p class="noresult">Još niko nije dodao ' + (foods ? "namirnicu" : "jelo") + '.</p>');
      }
      if (foods) {
        CATS.forEach(function (c) {
          var inCat = STD_FOODS.filter(function (f) { return f.cat === c; });

        });
        html += '<p class="src">Standardna lista: približne vrednosti na 100 g ili 100 ml (USDA FoodData Central i deklaracije).</p>';
      } else {
        html += '<div class="group-h">Sva jela</div>' + ul(std.filter(function (d) { return !isGood(d); }), dishRow) +
          '<p class="src">Kalorije su za 1 porciju. Jelo je zbir namirnica, pa se računa samo.</p>';
      }
    }
    $("foodList").innerHTML = html;
  }

  $("foodBody").addEventListener("click", function (e) {
    var t;
    if ((t = e.target.closest("[data-tab]"))) { fs.tab = t.getAttribute("data-tab"); fs.query = ""; $("foodSearch").value = ""; renderList(); return; }
    if ((t = e.target.closest("[data-food]"))) { fs.food = FOOD_BY_ID[t.getAttribute("data-food")]; fs.qty = fs.food.portion || 100; fs.view = "detail"; renderFoods(); return; }
    if ((t = e.target.closest("[data-dish]"))) { fs.dish = dishById(t.getAttribute("data-dish")); fs.portions = 1; fs.view = "dish"; renderFoods(); return; }
    if (e.target.closest("[data-newdish]")) { fs.draft = { id: null, name: "", items: [], back: false }; fs.view = "builder"; renderFoods(); return; }
    if (e.target.closest("[data-newfood]")) { fs.fdraft = { id: null, name: fs.query.trim(), cat: "Ostalo", unit: "g", back: false }; fs.view = "foodform"; renderFoods(); return; }
    if ((t = e.target.closest("[data-qty]"))) { $("qtyIn").value = t.getAttribute("data-qty"); updateDetail(); return; }
    if ((t = e.target.closest("[data-port]"))) { $("portIn").value = dec(+t.getAttribute("data-port")); updateDish(); return; }
    if ((t = e.target.closest("[data-bres]"))) {
      var f = FOOD_BY_ID[t.getAttribute("data-bres")];
      fs.draft.items.push([f.id, f.portion || 100]);
      $("bSearch").value = ""; fs.bq = ""; renderBuilderParts(); $("bSearch").focus(); return;
    }
    if ((t = e.target.closest("[data-brm]"))) { fs.draft.items.splice(+t.getAttribute("data-brm"), 1); renderBuilderParts(); return; }

  function mealSelect() {

    }).join("") + '</select>';
  }

    return '<div class="big"><b id="dKcal">0</b><span>kcal</span></div>' +

        '<div class="mbox p"><small><i></i>Proteini</small><b id="dP">0</b> g</div>' +

      '</div>';

  function showMacros(m) {

  function addToMeal(item) {
    var meal = $("mealSel").value;
    state.days[day] = state.days[day] || {};
    (state.days[day][meal] = state.days[day][meal] || []).push(item);
    openMeals = {}; openMeals[meal] = true;
  }
  function replaceItem(item) { state.days[day][fs.meal][fs.index] = item; }
  function removeItem() { state.days[day][fs.meal].splice(fs.index, 1); }
  function finish() { save(); render(); closeFoods(); }
  function editButtons(saveLabel) {
    return '<div class="addrow"><button class="btn" id="saveItem">' + saveLabel + '</button><button class="btn danger" id="delItem">Obriši</button></div>';
  }
  // dugme koje traži drugi klik kao potvrdu
  function confirmClick(el, label, fn) {
    var armed = false;
    el.onclick = function () {
      if (!armed) { armed = true; el.textContent = label; return; }
      el.disabled = true; fn();
    };
  }
  function busy(btn, promise, err) {
    btn.disabled = true;
    return promise.catch(function (e) { btn.disabled = false; if (err) err.textContent = (e && e.message) || "Čuvanje nije uspelo. Pokušaj ponovo."; throw e; });
  }

  // --- namirnica ---
  function renderDetail() {
    var f = fs.food, edit = fs.mode === "edit";
    $("foodTitle").textContent = f.name;
    var u = f.unit, chips = [];
    if (f.portion) chips.push(f.portion);
    [50, 100, 150, 200, 250].forEach(function (v) { if (chips.indexOf(v) === -1) chips.push(v); });
    chips.sort(function (a, b) { return a - b; });
    var usedBy = allDishes().filter(function (d) { return d.items.some(function (x) { return x[0] === f.id; }); }).length;
    $("foodBody").innerHTML =
      '<div class="detail">' +
        '<div class="cat">' + esc(f.cat) + (f.note ? " · " + esc(f.note) : "") + '<br>' + esc(author(f)) + '</div>' +
        '<div class="field"><label for="qtyIn">Količina (' + (u === "ml" ? "mililitri" : "grami") + ')</label>' +
          '<div class="qty"><div class="inwrap"><input id="qtyIn" type="text" inputmode="decimal" autocomplete="off" value="' + fs.qty + '"><span class="u">' + u + '</span></div></div></div>' +
        '<div class="chips">' + chips.map(function (v) { return '<button class="chip" data-qty="' + v + '">' + v + ' ' + u + (v === f.portion ? " · porcija" : "") + '</button>'; }).join("") + '</div>' +

        '<table class="per100"><thead><tr><th>Na 100 ' + u + '</th><th></th></tr></thead><tbody>' +
          '<tr><td>Energija</td><td>' + fmt(f.kcal) + ' kcal</td></tr>' +
          '<tr><td>Proteini</td><td>' + dec(f.p) + ' g</td></tr>' +
          '<tr><td>Ugljeni hidrati</td><td>' + dec(f.c) + ' g</td></tr>' +
          '<tr><td>Masti</td><td>' + dec(f.f) + ' g</td></tr>' +
        '</tbody></table>' +
        (!edit && isMine(f) ? '<div class="addrow two"><button class="btn ghost" id="editFood">Izmeni namirnicu</button><button class="btn danger" id="delFood">Obriši namirnicu</button></div><p class="err" id="fErr"></p>' : "") +
      '</div>';
    $("qtyIn").addEventListener("input", updateDetail);

      $("saveItem").onclick = function () { var q = num("qtyIn"); if (!q) return $("qtyIn").focus(); replaceItem(itemFrom(f, q)); finish(); };
      $("delItem").onclick = function () { removeItem(); finish(); };
    } else {

        var q = num("qtyIn"); if (!q) return $("qtyIn").focus();

        finish();

      if (isMine(f)) {
        $("editFood").onclick = function () {
          fs.fdraft = { id: f.id, name: f.name, cat: f.cat, unit: f.unit, kcal: f.kcal, p: f.p, f: f.f, c: f.c, portion: f.portion, back: true };
          fs.view = "foodform"; renderFoods();

  function num(id) { var q = parseFloat(String($(id).value).replace(",", ".")); return q > 0 ? q : 0; }

  function mergeIds(a, b, max) {
    var out = [];
    (a || []).concat(b || []).forEach(function (id) { if (out.indexOf(id) === -1) out.push(id); });
    return out.slice(0, max);
  }
  var lastUid = null;
  KDB.onChange(function (what) {
    if (what === "auth") {
      var uid = KDB.user && KDB.user.uid;
      if (uid && uid !== lastUid) {
        lastUid = uid;
        state = loadLocal(); day = todayKey(); openMeals = {};
        personalReady = false; dirtyDays = {}; metaDirty = false;
        render();
        KDB.loadPersonal().then(function (cloud) {
          if (KDB.myId() !== uid) return;
          var local = state, push;
          if (cloud) {
            state = fill(cloud);
            // ono što je izmenjeno pre nego što je baza odgovorila ima prednost
            Object.keys(dirtyDays).forEach(function (k) { state.days[k] = local.days[k] || {}; });
            if (metaDirty) {
              state.profile = local.profile || state.profile;
              state.recent = mergeIds(local.recent, state.recent, 12);
              state.recentDishes = mergeIds(local.recentDishes, state.recentDishes, 8);
            }
            push = Object.keys(dirtyDays);
          } else {
            push = Object.keys(state.days); // prvi put na ovom nalogu: prebaci sve uneto na ovom uređaju
          }
          if (cloud && metaDirty) {
            state.streak = local.streak || state.streak; state.best = Math.max(local.best || 0, state.best || 0);
            state.weights = state.weights || local.weights;
            state.smoke = local.smoke || state.smoke;
          }
          personalReady = true;
          seedWeight();
          updateStreak();                       // pre brisanja starih dana, da se niz ne izgubi
          KDB.deleteDays(pruneDays());
          KDB.savePersonal(state, push, teamDoc());
          dirtyDays = {}; metaDirty = false;
          try { localStorage.setItem(userKey(), JSON.stringify(state)); } catch (e) {}
          render();
          maybeAskWeight();
        }).catch(function (e) { KDB.error = e.message; renderAccount(); });

      if (!uid && lastUid) {

        closeSheet(); closeFoods(); closeTeam(); closeWeight(); closeExercise(); closeSmoke(); render();

      if (fs.view === "list") renderList();

  });
  renderAccount();

  // ---------- 15 dana, niz dana (streak) ----------
  // Obroci se čuvaju samo za poslednjih 15 dana. Niz dana se pamti kao {start, last},
  // pa se ne gubi ni kad se stari dani obrišu.
  var KEEP_DAYS = 15;
  function windowStart() { return shift(todayKey(), -(KEEP_DAYS - 1)); }
  function pruneDays() {
    var ws = windowStart(), old = [];
    Object.keys(state.days).forEach(function (k) { if (k < ws) { old.push(k); delete state.days[k]; } });
    return old;
  }
  function hasItems(dd) {
    if (!dd) return false;
    for (var i = 0; i < MEALS.length; i++) if ((dd[MEALS[i].id] || []).length) return true;
    return false;
  }
  function daysBetween(a, b) { return Math.round((parseKey(b) - parseKey(a)) / 86400000); }
  // Niz = uzastopni dani sa bar jednom stavkom, zaključno sa danas (ili juče, ako danas još ništa).
  function updateStreak() {
    var t = todayKey(), ws = windowStart();
    var end = hasItems(state.days[t]) ? t : shift(t, -1);
    if (!hasItems(state.days[end])) return { count: 0, last: state.streak ? state.streak.last : "" };
    var d = end, start;
    for (;;) {
      var prev = shift(d, -1);
      if (hasItems(state.days[prev])) { d = prev; continue; }
      if (prev >= ws) { start = d; break; }               // poznat prazan dan: niz počinje ovde
      var st = state.streak;                               // dan je obrisan: oslanjamo se na zapamćeni niz
      start = st && st.start && st.start <= prev && st.last >= prev ? st.start : d;
      break;
    }
    state.streak = { start: start, last: end };
    var count = daysBetween(start, end) + 1;
    if (count > (state.best || 0)) state.best = count;
    return { count: count, last: end };
  }
  // ono što ekipa vidi: ime, % današnjeg cilja i niz dana (ne i šta je ko jeo)
  function teamDoc() {
    var t = todayKey(), dd = state.days[t] || {}, eaten = 0;
    MEALS.forEach(function (m) { (dd[m.id] || []).forEach(function (it) { eaten += it.kcal || 0; }); });
    var sk = updateStreak();
    var doc = { name: KDB.user.name, day: t, pct: Math.min(999, Math.round(eaten / goal() * 100)), streak: sk.count, last: sk.last || "", best: state.best || 0 };
    if (smokeOn()) doc.smoke = smokeDays();
    return doc;
  }

  // ---------- Ekipa ----------
  var FLAME = document.querySelector("#streakBadge .flame").outerHTML;
  var teamUnsub = null, teamList = [];
  function openTeam() {

    $("teamOverlay").hidden = false; document.body.style.overflow = "hidden";
